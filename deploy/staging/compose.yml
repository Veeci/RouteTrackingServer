# Staging stack on Laptop 2 (phase 1.5, docs/ops/staging-setup.md). Each deploy copies this file to
# /srv/rts/compose.yml, and deploy.sh runs it with project name rts-staging. Secrets come from /srv/rts/.env, never
# from git. One app instance and no Redis: live updates stay in the process (phase 10 adds the second instance).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rts
      POSTGRES_USER: rts
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in /srv/rts/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 checks over TCP. On first boot the image runs a temporary server on the Unix socket only,
      # so a socket check could pass while the app still gets "connection refused".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rts -d rts"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only the app reaches the database, over the compose network.

  app:
    image: ghcr.io/veeci/route-tracking-server:${IMAGE_TAG:?deploy.sh sets IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: staging
      APP_VERSION: ${IMAGE_TAG}
      DB_URL: jdbc:postgresql://db:5432/rts
      DB_USER: rts
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set in /srv/rts/.env}
      # Guards /api/v1/dev/tokens (X-Staging-Token). The app refuses to start without it, or with fewer than 32 characters.
      STAGING_ACCESS_TOKEN: ${STAGING_ACCESS_TOKEN:?set in /srv/rts/.env}
      # Empty: one instance, no Redis. /health/ready then has no redis check (it is never critical anyway).
      REDIS_URL: ""
      # false until T1b.4 has checked which headers Funnel sends. Set it in /srv/rts/.env to try it.
      HTTP_TRUSTFORWARDEDHEADERS: ${HTTP_TRUSTFORWARDEDHEADERS:-false}
      # The admin plane's own port (phase 12a): /api/v1/admin and /ws/v1/admin answer only here, and 8080 answers 404
      # for them, so Funnel never reaches the admin API. Health, dev tokens and the trip routes answer on both ports.
      HTTP_ADMINPORT: "8081"
      # The admin dashboard's identity provider (12g, the keycloak service below). KEYCLOAK_URL is the URL browsers
      # use, so it is also the `iss` of every token. Unset, both stay empty and the server accepts dev tokens only.
      # The JWKS comes over the compose network: the keys are the same at any address, and this one needs no TLS.
      # No depends_on: the server fetches the keys at the first provider token, and must not stop with Keycloak.
      OIDC_ISSUER: ${KEYCLOAK_URL:+${KEYCLOAK_URL}/realms/rts}
      OIDC_JWKS: ${KEYCLOAK_URL:+http://keycloak:8080/realms/rts/protocol/openid-connect/certs}
    volumes:
      - /srv/rts/osm/hanoi.osm:/app/data/osm/hanoi.osm:ro
      # The binary graph cache (slice 6d): a start whose hanoi.osm matches it skips the XML parse. The OSM file stays
      # read-only. Only this small volume is writable. Losing it costs one slow start, never data.
      - osm-cache:/app/data/osm/cache
    ports:
      - "127.0.0.1:8080:8080"   # loopback only: Funnel is the one public entry
      - "127.0.0.1:8081:8081"   # admin port, loopback only and never behind Funnel. Operators go through admin-web
    mem_limit: 2g               # MaxRAMPercentage=75 in the image gives a 1.5 GB heap

  # The admin dashboard (phase 12f, decision D2/H1): nginx with the built app, proxying /api and /ws to app:8081.
  # `tailscale serve --bg --https=8443 http://127.0.0.1:8090` makes it reachable from the tailnet only. Built from the
  # same commit as the app, so deploy.sh moves both together.
  admin-web:
    image: ghcr.io/veeci/route-tracking-admin-web:${ADMIN_WEB_TAG:-${IMAGE_TAG:?deploy.sh sets IMAGE_TAG}}
    restart: unless-stopped
    # No depends_on: nginx resolves "app" per request, so it starts, and answers /healthz, while the app is down.
    # The API then answers 502 until the app is up.
    ports:
      - "127.0.0.1:8090:8080"   # loopback only: tailscale serve is the one entry, and only for tailnet devices
    read_only: true             # nginx writes only its pid and proxy buffers, both in /tmp
    tmpfs:
      - /tmp
    mem_limit: 64m

  # The identity provider of the admin dashboard (12g, decision D7). deploy.sh starts these two only when /srv/rts/.env
  # sets KEYCLOAK_URL. Its own Postgres, so the app's database and Keycloak upgrade apart. backup.sh dumps both.
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      # ":-" and not ":?": compose reads the whole file for every command, and staging without Keycloak must still run.
      # deploy.sh checks these secrets before it starts Keycloak.
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    # No ports: only Keycloak reaches it.

  # `tailscale serve --bg --https=8444 http://127.0.0.1:8180` makes it reachable from the tailnet only, like the
  # dashboard on 8443 (D2/H1). The version is pinned here, not tied to the commit, so deploy.sh never rolls it back.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # start, not start-dev: production mode, with the database below and strict hostname checks. Without
    # --optimized, Keycloak rebuilds its configuration at each start (about 20 s), which spares us a custom image.
    # --import-realm creates the realm `rts` on the first start and skips it once it exists. Later changes go through
    # the admin console and live in the database.
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
      # The URL browsers use. Keycloak writes it into every link and into the tokens' `iss`, whatever host a request
      # names, so the server's own request to keycloak:8080 still gets the same keys.
      KC_HOSTNAME: ${KEYCLOAK_URL:-}
      # tailscale serve terminates TLS and forwards plain HTTP, with X-Forwarded-For and X-Forwarded-Proto. Only the
      # laptop reaches 8180 (loopback), so trusting those headers is safe.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # /health/ready on the management port 9000, for the healthcheck. 9000 is not published.
      KC_HEALTH_ENABLED: "true"
      # The first admin of the master realm. Keycloak 26 marks it temporary: the staging guide replaces it with a
      # permanent admin, after which these two values do nothing.
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Read by the realm file's ${RTS_ADMIN_WEB_URL} placeholders: the dashboard's redirect and logout URLs.
      RTS_ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
    volumes:
      - ./keycloak/rts-realm.json:/opt/keycloak/data/import/rts-realm.json:ro
    healthcheck:
      # The image has bash but no curl or wget. This sends one HTTP request over bash's /dev/tcp and reads the status
      # line: 200 when ready, 503 while Keycloak still bootstraps. Not a grep for "UP" in the body: a DOWN answer
      # holds one too, in its "Graceful Shutdown" check.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s       # the configuration rebuild and the first realm import on this CPU
    ports:
      - "127.0.0.1:8180:8080"   # loopback only: tailscale serve on 8444 is the one entry, for tailnet devices
    mem_limit: 1g               # Keycloak sizes its heap to 70 % of this

volumes:
  db-data:
  osm-cache:
  keycloak-db-data:
