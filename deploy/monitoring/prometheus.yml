# Prometheus for the local stack and the staging laptop (phase 10c). Started by the compose profile "monitoring".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rts
    metrics_path: /metrics
    # Every app container: with --scale app=2, the service name resolves to each instance's address.
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8080
        refresh_interval: 30s
