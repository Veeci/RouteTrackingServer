# Alertmanager (phase 10c). The webhook URL is never in git: entrypoint.sh fills __DISCORD_WEBHOOK_URL__ from the
# DISCORD_WEBHOOK_URL environment variable, or uses alertmanager-silent.yml when it is not set.
route:
  receiver: discord
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url: "__DISCORD_WEBHOOK_URL__"
        send_resolved: true
