# The admin dashboard's nginx (phase 12f, decision D2/H1). The image copies this file to /etc/nginx/conf.d/default.conf,
# inside the image's http block. It serves the built app and proxies /api and /ws to the server's admin port, so the
# browser sees one origin and CORS never comes up.
#
#   tailscale serve :8443 (tailnet only) -> 127.0.0.1:8090 on the laptop -> this container :8080 -> app:8081

# MapLibre 6 starts its worker from maplibre-gl-worker-<hash>.mjs as a module worker, and the browser refuses a module
# script with any MIME type but JavaScript. The stock mime.types (nginx 1.30) maps .js only, so .mjs would go out as
# application/octet-stream and the map would stay blank. A second types block at http level adds to the first one.
# (Inside a server or location block it would replace the whole list.)
types {
    application/javascript mjs;
}

server_tokens off;

gzip on;
gzip_types application/javascript text/css application/json image/svg+xml;
gzip_min_length 1024;

# The WebSocket handshake needs "Connection: upgrade". Other requests close the upstream connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# tailscale serve terminates TLS and sends X-Forwarded-Proto: https. Without it (a local run), use this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The client address for the logs and for the app's per-IP rate limit (12f). A request reaches this container
    # from the Docker network (the published port arrives from the bridge gateway), never from an operator directly.
    # tailscale serve writes the operator's tailnet address into X-Forwarded-For. Trust that header from private
    # peers only, and take the last address that no trusted peer added.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's DNS. A variable in proxy_pass makes nginx resolve "app" per request (cached 10 s). A literal
    # proxy_pass http://app:8081 resolves once at start: nginx would then refuse to start while the app is down, and
    # keep the old address after a deploy recreates the app container, answering 502 until it restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_plane http://app:8081;

    # For the container's health check and deploy.sh. Answers without touching the app.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The admin API and everything else under /api (dev tokens, trips) on the admin port. The app sends its own
    # headers here. nginx adds none, so no header comes twice.
    location /api/ {
        proxy_pass $admin_plane;
        proxy_set_header Host $host;
        # Exactly one address: the operator's, after real_ip above. The app's admin port trusts this header (12f).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The admin sockets (fleet, trip). The server pings every 15 s, so 120 s without a frame means the socket is dead.
    location /ws/ {
        proxy_pass $admin_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite's output: every file name holds a content hash, so a cached copy never goes stale.
    # An add_header in a location drops every add_header from outer levels, so each location includes the headers.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html, favicon.svg and version.json, and index.html for any other path, so the router handles deep links
    # such as /drivers/42. no-cache: the browser asks again each time, and gets the newest asset names after a deploy.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
