# Local stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d db          # database only (usual dev loop, app runs from Gradle/IDE)
#   docker compose -f deploy/docker-compose.yml up --build        # database + app container
#   docker compose -f deploy/docker-compose.yml --profile observability up --build   # + Jaeger tracing UI on :16686
name: route-tracking

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rts}
      POSTGRES_USER: ${DB_USER:-rts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: route-tracking-server:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-rts}
      DB_USER: ${DB_USER:-rts}
      DB_PASSWORD: ${DB_PASSWORD}
      # Tracing is off unless the observability profile's settings are provided (see .env.example).
      # Extra JVM flags for the start script (empty by default; the JVM would announce an empty JAVA_TOOL_OPTIONS).
      APP_OPTS: ${OTEL_JAVA_TOOL_OPTIONS:-}
      OTEL_SERVICE_NAME: route-tracking-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8080:8080"

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["observability"]
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP

volumes:
  db-data:
