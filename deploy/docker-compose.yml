# Local stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d db          # database only (usual dev loop, app runs from Gradle/IDE)
#   docker compose -f deploy/docker-compose.yml up --build        # database + app container
#   docker compose -f deploy/docker-compose.yml --profile observability up --build   # + Jaeger tracing UI on :16686
#   REDIS_URL=redis://redis:6379 docker compose -f deploy/docker-compose.yml --profile scale up --build --scale app=2
#                                                                     # + Redis, for several app instances (phase 10)
#   docker compose -f deploy/docker-compose.yml --profile monitoring up --build   # + Prometheus :9090, Alertmanager
#                                                                     # :9093, Grafana :3000 (phase 10c, deploy/monitoring)
name: route-tracking

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rts}
      POSTGRES_USER: ${DB_USER:-rts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: route-tracking-server:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-rts}
      DB_USER: ${DB_USER:-rts}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # Empty: one instance, no Redis. Set with the scale profile to share live updates between instances.
      REDIS_URL: ${REDIS_URL:-}
      # Tracing is off unless the observability profile's settings are provided (see .env.example).
      # Extra JVM flags for the start script (empty by default; the JVM would announce an empty JAVA_TOOL_OPTIONS).
      APP_OPTS: ${OTEL_JAVA_TOOL_OPTIONS:-}
      OTEL_SERVICE_NAME: route-tracking-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      # A range, so --scale app=2 gives each instance its own port (8080, 8081). Phase 10b puts a load balancer in front.
      - "8080-8081:8080"

  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      # Empty: alerts notify nobody. Set it in deploy/.env to get them in a Discord channel.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # local and tailnet only: Grafana is never behind Funnel
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["observability"]
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP

volumes:
  db-data:
