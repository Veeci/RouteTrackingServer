asyncapi: 3.0.0
info:
  title: RouteTrackingServer WebSocket API
  version: 1.0.0
  description: |
    Messages on the WebSocket endpoints. Every frame is one JSON text frame that holds one message.
    The `type` field says which message a frame holds.

    Rules that a schema cannot express (handshake order, ack after commit, batch numbering,
    close codes, limits) are in docs/architecture/protocol.md. Sample frames are in
    protocol/src/test/resources/golden/. A test checks every sample against this document.

    Compatibility rules:
    - A reader ignores fields that it does not know. The schemas below forbid extra fields only
      so that this document stays complete. A newer peer may still send more fields.
    - A client must accept error codes and rejection reasons that are not listed here.

servers:
  local:
    host: localhost:8080
    protocol: ws
    description: Local development server (docker compose, or ./gradlew :app:run).

defaultContentType: application/json

channels:
  driver:
    address: /ws/v1/driver
    title: Driver session
    description: |
      One socket per tracking session of a driver device. The first client message must be `hello`.
      If no `hello` arrives within the handshake timeout, the server closes the socket with 4401.
    messages:
      hello:
        $ref: '#/components/messages/hello'
      fix_batch:
        $ref: '#/components/messages/fix_batch'
      welcome:
        $ref: '#/components/messages/welcome'
      ack:
        $ref: '#/components/messages/ack'
      error:
        $ref: '#/components/messages/error'

  guest:
    address: /ws/v1/guest
    title: Guest watches a trip
    description: |
      One socket per watched trip; only a GUEST token may use it (other roles: close 4403). The first client message
      is `subscribe`. Another user's trip answers `error` TRIP_NOT_FOUND, the same as a trip that does not exist,
      and the socket stays open. After `subscribed` the server sends live messages until the trip reaches a final
      stage (COMPLETED, CANCELLED); then it sends that `trip_event` and closes the socket with 1000.
    messages:
      subscribe:
        $ref: '#/components/messages/subscribe'
      subscribed:
        $ref: '#/components/messages/subscribed'
      driver_position:
        $ref: '#/components/messages/driver_position'
      trip_progress:
        $ref: '#/components/messages/trip_progress'
      trip_event:
        $ref: '#/components/messages/trip_event'
      error:
        $ref: '#/components/messages/error'

operations:
  receiveHello:
    action: receive
    channel:
      $ref: '#/channels/driver'
    summary: Open a tracking session, or resume it after a reconnect.
    messages:
      - $ref: '#/channels/driver/messages/hello'
    reply:
      channel:
        $ref: '#/channels/driver'
      messages:
        - $ref: '#/channels/driver/messages/welcome'
  receiveFixBatch:
    action: receive
    channel:
      $ref: '#/channels/driver'
    summary: Store a batch of fixes. The server sends the ack only after the batch is committed.
    messages:
      - $ref: '#/channels/driver/messages/fix_batch'
    reply:
      channel:
        $ref: '#/channels/driver'
      messages:
        - $ref: '#/channels/driver/messages/ack'
  sendError:
    action: send
    channel:
      $ref: '#/channels/driver'
    summary: Report a recoverable problem with one client message. The session stays open.
    messages:
      - $ref: '#/channels/driver/messages/error'

  receiveSubscribe:
    action: receive
    channel:
      $ref: '#/channels/guest'
    summary: Start watching one of the guest's own trips.
    messages:
      - $ref: '#/channels/guest/messages/subscribe'
    reply:
      channel:
        $ref: '#/channels/guest'
      messages:
        - $ref: '#/channels/guest/messages/subscribed'
  sendLiveUpdates:
    action: send
    channel:
      $ref: '#/channels/guest'
    summary: Live updates of the watched trip. Positions and progress are "latest wins"; a slow client may miss some.
    messages:
      - $ref: '#/channels/guest/messages/driver_position'
      - $ref: '#/channels/guest/messages/trip_progress'
      - $ref: '#/channels/guest/messages/trip_event'
  sendGuestError:
    action: send
    channel:
      $ref: '#/channels/guest'
    summary: Report a problem with one client message. The session stays open.
    messages:
      - $ref: '#/channels/guest/messages/error'

components:
  messages:
    hello:
      name: hello
      title: Hello
      summary: First client message of a session.
      payload:
        $ref: '#/components/schemas/Hello'
    fix_batch:
      name: fix_batch
      title: Fix batch
      summary: A numbered batch of fixes.
      payload:
        $ref: '#/components/schemas/FixBatch'
    welcome:
      name: welcome
      title: Welcome
      summary: The session is open. Says which seq the client sends next.
      payload:
        $ref: '#/components/schemas/Welcome'
    ack:
      name: ack
      title: Ack
      summary: A batch is stored. The client may delete it from its queue.
      payload:
        $ref: '#/components/schemas/Ack'
    error:
      name: error
      title: Error
      summary: A recoverable problem with one client message.
      payload:
        $ref: '#/components/schemas/Error'

    subscribe:
      name: subscribe
      title: Subscribe
      summary: Watch one trip.
      payload:
        $ref: '#/components/schemas/Subscribe'
    subscribed:
      name: subscribed
      title: Subscribed
      summary: Watching started; the trip as it is now.
      payload:
        $ref: '#/components/schemas/Subscribed'
    driver_position:
      name: driver_position
      title: Driver position
      summary: Where the driver is now.
      payload:
        $ref: '#/components/schemas/DriverPosition'
    trip_progress:
      name: trip_progress
      title: Trip progress
      summary: Distance to the target and the expected time of arrival.
      payload:
        $ref: '#/components/schemas/TripProgress'
    trip_event:
      name: trip_event
      title: Trip event
      summary: The trip moved to another stage.
      payload:
        $ref: '#/components/schemas/TripEvent'

  schemas:
    Subscribe:
      type: object
      additionalProperties: false
      required: [type, tripId]
      properties:
        type:
          const: subscribe
        tripId:
          type: string
          format: uuid

    Subscribed:
      type: object
      additionalProperties: false
      required: [type, trip]
      properties:
        type:
          const: subscribed
        trip:
          $ref: '#/components/schemas/GuestTrip'

    GuestTrip:
      type: object
      additionalProperties: false
      required: [tripId, status, pickup, destination, updatedAt]
      properties:
        tripId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TripStatus'
        pickup:
          $ref: '#/components/schemas/Point'
        destination:
          $ref: '#/components/schemas/Point'
        driverId:
          type: string
          format: uuid
          description: Absent until a driver accepts the trip.
        updatedAt:
          type: string
          format: date-time

    TripStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]

    Point:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    DriverPosition:
      type: object
      additionalProperties: false
      required: [type, tripId, lat, lng, recordedAt]
      properties:
        type:
          const: driver_position
        tripId:
          type: string
          format: uuid
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        bearingDeg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Degrees, 0 = north. Rotate the car marker with it.
        speedMps:
          type: number
          minimum: 0
        recordedAt:
          type: string
          format: date-time

    TripProgress:
      type: object
      additionalProperties: false
      required: [type, tripId, target, remainingM, etaS, basis]
      properties:
        type:
          const: trip_progress
        tripId:
          type: string
          format: uuid
        target:
          type: string
          enum: [PICKUP, DESTINATION]
          description: PICKUP while the driver comes to the guest, DESTINATION during the ride.
        remainingM:
          type: number
          minimum: 0
        etaS:
          type: number
          minimum: 0
          description: Seconds until arrival at the target, from a smoothed speed (at least 2 m/s).
        basis:
          type: string
          enum: [STRAIGHT_LINE, ROUTE]
          description: STRAIGHT_LINE until distances are measured along the road (phase 7).

    TripEvent:
      type: object
      additionalProperties: false
      required: [type, tripId, event, status, at]
      properties:
        type:
          const: trip_event
        tripId:
          type: string
          format: uuid
        event:
          type: string
          enum: [status_changed]
        status:
          $ref: '#/components/schemas/TripStatus'
        at:
          type: string
          format: date-time

    Hello:
      type: object
      additionalProperties: false
      required: [type, protocolVersion, deviceId, sessionId, sdkVersion]
      properties:
        type:
          const: hello
        protocolVersion:
          type: integer
          description: Version 1 is the only supported version. Any other value closes the socket with 4400.
        deviceId:
          type: string
          minLength: 1
          description: Stable id of the device. The driver is identified by the access token, not by this id.
        sessionId:
          type: string
          format: uuid
          description: Generated by the SDK when tracking starts. Stays the same across reconnects.
        lastAckedSeq:
          type: integer
          minimum: 1
          description: Highest seq that the client received an ack for. Absent before the first ack. Informational only.
        sdkVersion:
          type: string

    FixBatch:
      type: object
      additionalProperties: false
      required: [type, seq, fixes]
      properties:
        type:
          const: fix_batch
        seq:
          type: integer
          minimum: 1
          description: 1 for the first batch of a session, +1 for each new batch. A resend keeps its seq and its content.
        fixes:
          type: array
          minItems: 1
          description: At most `welcome.limits.maxFixesPerBatch` fixes.
          items:
            $ref: '#/components/schemas/Fix'

    Fix:
      type: object
      additionalProperties: false
      required: [lat, lng, accuracyM, recordedAt]
      description: |
        One position as the device measured it. A fix with a value outside these ranges is rejected
        with reason INVALID_VALUE in the ack. The rest of the batch is still stored.
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: WGS 84 degrees.
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: WGS 84 degrees.
        accuracyM:
          type: number
          exclusiveMinimum: 0
          description: Horizontal accuracy radius in meters (68% confidence).
        speedMps:
          type: number
          minimum: 0
        speedAccuracyMps:
          type: number
          minimum: 0
        bearingDeg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Degrees, 0 = north.
        bearingAccuracyDeg:
          type: number
          minimum: 0
        altitudeM:
          type: number
        verticalAccuracyM:
          type: number
          minimum: 0
        recordedAt:
          type: string
          format: date-time
          description: UTC time at which the device recorded the fix (device clock).
        provider:
          type: string
          enum: [GMS_FUSED, AOSP_GPS, AOSP_NETWORK, AOSP_FUSED, UNKNOWN]
          default: UNKNOWN
          description: The location stack that produced the fix. The server reads an unknown value as UNKNOWN.
        mock:
          type: boolean
          default: false
          description: The OS marked the fix as coming from a mock location provider. Such a fix is rejected with MOCK_LOCATION.
        satellites:
          $ref: '#/components/schemas/Satellites'

    Satellites:
      type: object
      additionalProperties: false
      required: [usedInFix]
      description: Absent for fixes that did not come from GNSS (Wi-Fi, cell).
      properties:
        usedInFix:
          type: integer
          minimum: 0
        meanCn0DbHz:
          type: number
          minimum: 0
          description: Mean carrier-to-noise density of the satellites used in the fix.

    Welcome:
      type: object
      additionalProperties: false
      required: [type, sessionId, resumeFromSeq, serverTime, limits]
      properties:
        type:
          const: welcome
        sessionId:
          type: string
          format: uuid
        resumeFromSeq:
          type: integer
          minimum: 1
          description: The highest seq that the server has stored for this session, plus 1. It wins over `hello.lastAckedSeq`.
        serverTime:
          type: string
          format: date-time
        limits:
          $ref: '#/components/schemas/Limits'

    Limits:
      type: object
      additionalProperties: false
      required: [maxFixesPerBatch, maxFrameBytes, maxMessagesPerSecond]
      properties:
        maxFixesPerBatch:
          type: integer
          minimum: 1
        maxFrameBytes:
          type: integer
          minimum: 1
          description: A larger frame closes the socket with 1009.
        maxMessagesPerSecond:
          type: integer
          minimum: 1
          description: Messages above this rate are dropped with error RATE_LIMITED.

    Ack:
      type: object
      additionalProperties: false
      required: [type, seq, accepted, rejected]
      properties:
        type:
          const: ack
        seq:
          type: integer
          minimum: 1
        accepted:
          type: integer
          minimum: 0
          description: How many fixes of the batch passed the pipeline.
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/Rejection'

    Rejection:
      type: object
      additionalProperties: false
      required: [index, reason]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the fix in `fix_batch.fixes`, as the client sent it.
        reason:
          type: string
          enum:
            - INVALID_VALUE
            - MOCK_LOCATION
            - POOR_ACCURACY
            - FUTURE_TIMESTAMP
            - TOO_OLD
            - DUPLICATE_TIMESTAMP
            - IMPLAUSIBLE_JUMP

    Error:
      type: object
      additionalProperties: false
      required: [type, code, message]
      properties:
        type:
          const: error
        code:
          type: string
          enum:
            - MALFORMED_MESSAGE
            - INVALID_MESSAGE
            - UNKNOWN_MESSAGE
            - RATE_LIMITED
            - EMPTY_BATCH
            - BATCH_TOO_LARGE
            - INVALID_SEQ
            - SESSION_DEVICE_MISMATCH
            - TRIP_NOT_FOUND
          description: |
            MALFORMED_MESSAGE: the frame is not valid JSON.
            INVALID_MESSAGE: valid JSON, but the wrong shape or missing fields.
            UNKNOWN_MESSAGE: a `type` that this endpoint does not know.
            RATE_LIMITED: more messages per second than allowed; this message was dropped.
            EMPTY_BATCH, BATCH_TOO_LARGE, INVALID_SEQ: the batch was not stored and gets no ack.
            SESSION_DEVICE_MISMATCH: the hello names a session that another device or driver started. Start a
            new session (new sessionId) and send hello again.
            TRIP_NOT_FOUND (guest socket): no such trip, or one this guest may not see.
            INVALID_MESSAGE is also the answer to a hello with an invalid sessionId or deviceId, and to a
            second hello on the same socket.
        message:
          type: string
          description: For humans and logs. May change between versions.
        correlatesTo:
          type: integer
          description: The seq of the client message that this error is about, if it has one.
