asyncapi: 3.0.0
info:
  title: RouteTrackingServer WebSocket API
  version: 1.0.0
  description: |
    Messages on the WebSocket endpoints. Every frame is one JSON text frame that holds one message.
    The `type` field says which message a frame holds.

    Rules that a schema cannot express (handshake order, ack after commit, batch numbering,
    close codes, limits) are in docs/architecture/protocol.md. Sample frames are in
    protocol/src/test/resources/golden/. A test checks every sample against this document.

    Compatibility rules:
    - A reader ignores fields that it does not know. The schemas below forbid extra fields only
      so that this document stays complete. A newer peer may still send more fields.
    - A client must accept error codes and rejection reasons that are not listed here.

servers:
  local:
    host: localhost:8080
    protocol: ws
    description: Local development server (docker compose, or ./gradlew :app:run).

defaultContentType: application/json

channels:
  driver:
    address: /ws/v1/driver
    title: Driver session
    description: |
      One socket per tracking session of a driver device. The first client message must be `hello`.
      If no `hello` arrives within the handshake timeout, the server closes the socket with 4401.
    messages:
      hello:
        $ref: '#/components/messages/hello'
      fix_batch:
        $ref: '#/components/messages/fix_batch'
      device_status:
        $ref: '#/components/messages/device_status'
      command_ack:
        $ref: '#/components/messages/command_ack'
      command:
        $ref: '#/components/messages/command'
      route_updated:
        $ref: '#/components/messages/route_updated'
      welcome:
        $ref: '#/components/messages/welcome'
      ack:
        $ref: '#/components/messages/ack'
      error:
        $ref: '#/components/messages/error'

  guest:
    address: /ws/v1/guest
    title: Guest watches a trip
    description: |
      One socket per watched trip; only a GUEST token may use it (other roles: close 4403). The first client message
      is `subscribe`. Another user's trip answers `error` TRIP_NOT_FOUND, the same as a trip that does not exist,
      and the socket stays open. After `subscribed` the server sends live messages until the trip reaches a final
      stage (COMPLETED, CANCELLED); then it sends that `trip_event` and closes the socket with 1000.
    messages:
      subscribe:
        $ref: '#/components/messages/subscribe'
      subscribed:
        $ref: '#/components/messages/subscribed'
      driver_position:
        $ref: '#/components/messages/driver_position'
      trip_progress:
        $ref: '#/components/messages/trip_progress'
      trip_event:
        $ref: '#/components/messages/trip_event'
      route_updated:
        $ref: '#/components/messages/route_updated'
      error:
        $ref: '#/components/messages/error'

  adminFleet:
    address: /ws/v1/admin/fleet
    title: Staff watch the fleet on a map
    description: |
      Phase 11c. A browser cannot set headers on a WebSocket, so this socket authenticates with `?ticket=` only: a
      single-use ticket from `POST /api/v1/admin/ws-tickets`, valid 30 s. A missing, used or expired ticket is refused
      with HTTP 401 before the upgrade. An access token in a header or in `?token=` is not accepted here. A ticket of
      any role but OPERATOR or ADMIN gets close 4403.

      The client sends `fleet_subscribe` with a map area. The server answers `fleet_snapshot` and then sends a
      `fleet_delta` every tick (2 s), empty when nothing changed. Positions are "latest wins": a delta carries a
      driver's marker as it is at the tick, not every fix since the last one. When the area holds more than 5 000
      matching drivers, the server sends `fleet_cluster` every tick instead, and no deltas. Another `fleet_subscribe`
      replaces the area and starts again with a snapshot. A socket that does not take a message within 5 s is closed
      with 1013. Reconnect with a new ticket.
    messages:
      fleet_subscribe:
        $ref: '#/components/messages/fleet_subscribe'
      fleet_snapshot:
        $ref: '#/components/messages/fleet_snapshot'
      fleet_delta:
        $ref: '#/components/messages/fleet_delta'
      fleet_cluster:
        $ref: '#/components/messages/fleet_cluster'
      error:
        $ref: '#/components/messages/error'

operations:
  receiveHello:
    action: receive
    channel:
      $ref: '#/channels/driver'
    summary: Open a tracking session, or resume it after a reconnect.
    messages:
      - $ref: '#/channels/driver/messages/hello'
    reply:
      channel:
        $ref: '#/channels/driver'
      messages:
        - $ref: '#/channels/driver/messages/welcome'
  receiveFixBatch:
    action: receive
    channel:
      $ref: '#/channels/driver'
    summary: Store a batch of fixes. The server sends the ack only after the batch is committed.
    messages:
      - $ref: '#/channels/driver/messages/fix_batch'
    reply:
      channel:
        $ref: '#/channels/driver'
      messages:
        - $ref: '#/channels/driver/messages/ack'
  receiveDeviceStatus:
    action: receive
    channel:
      $ref: '#/channels/driver'
    summary: The device's battery and motion, every 30 s; also the driver's heartbeat. No reply.
    messages:
      - $ref: '#/channels/driver/messages/device_status'
  sendCommand:
    action: send
    channel:
      $ref: '#/channels/driver'
    summary: |
      A command for the device, live or right after `welcome`. The server sends it again after a reconnect until
      it gets `command_ack`, so the device handles each `commandId` once.
    messages:
      - $ref: '#/channels/driver/messages/command'
  sendDriverRoute:
    action: send
    channel:
      $ref: '#/channels/driver'
    summary: |
      The route the driver follows from now on (phase 7): when the APPROACH route is planned, when the ride
      starts, after a re-route, and again right after every `welcome` while the driver has an active trip.
    messages:
      - $ref: '#/channels/driver/messages/route_updated'
  receiveCommandAck:
    action: receive
    channel:
      $ref: '#/channels/driver'
    summary: The device applied or rejected a command. An unknown id gets error COMMAND_NOT_FOUND. No other reply.
    messages:
      - $ref: '#/channels/driver/messages/command_ack'
  sendError:
    action: send
    channel:
      $ref: '#/channels/driver'
    summary: Report a recoverable problem with one client message. The session stays open.
    messages:
      - $ref: '#/channels/driver/messages/error'

  receiveSubscribe:
    action: receive
    channel:
      $ref: '#/channels/guest'
    summary: Start watching one of the guest's own trips.
    messages:
      - $ref: '#/channels/guest/messages/subscribe'
    reply:
      channel:
        $ref: '#/channels/guest'
      messages:
        - $ref: '#/channels/guest/messages/subscribed'
  sendLiveUpdates:
    action: send
    channel:
      $ref: '#/channels/guest'
    summary: Live updates of the watched trip. Positions and progress are "latest wins"; a slow client may miss some.
    messages:
      - $ref: '#/channels/guest/messages/driver_position'
      - $ref: '#/channels/guest/messages/trip_progress'
      - $ref: '#/channels/guest/messages/trip_event'
      - $ref: '#/channels/guest/messages/route_updated'
  sendGuestError:
    action: send
    channel:
      $ref: '#/channels/guest'
    summary: Report a problem with one client message. The session stays open.
    messages:
      - $ref: '#/channels/guest/messages/error'

  receiveFleetSubscribe:
    action: receive
    channel:
      $ref: '#/channels/adminFleet'
    summary: Watch the drivers in a map area. It replaces the area watched before.
    messages:
      - $ref: '#/channels/adminFleet/messages/fleet_subscribe'
    reply:
      channel:
        $ref: '#/channels/adminFleet'
      messages:
        - $ref: '#/channels/adminFleet/messages/fleet_snapshot'
        - $ref: '#/channels/adminFleet/messages/fleet_cluster'
  sendFleetUpdates:
    action: send
    channel:
      $ref: '#/channels/adminFleet'
    summary: Every tick, the changes in the area, or its cluster counts when it holds too many drivers.
    messages:
      - $ref: '#/channels/adminFleet/messages/fleet_delta'
      - $ref: '#/channels/adminFleet/messages/fleet_cluster'
      - $ref: '#/channels/adminFleet/messages/fleet_snapshot'
  sendFleetError:
    action: send
    channel:
      $ref: '#/channels/adminFleet'
    summary: Report a problem with one client message, such as an invalid bbox. The session stays open.
    messages:
      - $ref: '#/channels/adminFleet/messages/error'

components:
  messages:
    hello:
      name: hello
      title: Hello
      summary: First client message of a session.
      payload:
        $ref: '#/components/schemas/Hello'
    fix_batch:
      name: fix_batch
      title: Fix batch
      summary: A numbered batch of fixes.
      payload:
        $ref: '#/components/schemas/FixBatch'
    device_status:
      name: device_status
      title: Device status
      summary: Battery and motion of the driver's device, every 30 s. Also the driver's heartbeat.
      payload:
        $ref: '#/components/schemas/DeviceStatus'
    command:
      name: command
      title: Command
      summary: Something the device should do (phase 5).
      payload:
        $ref: '#/components/schemas/Command'
    command_ack:
      name: command_ack
      title: Command ack
      summary: The device applied or rejected a command.
      payload:
        $ref: '#/components/schemas/CommandAck'
    welcome:
      name: welcome
      title: Welcome
      summary: The session is open. Says which seq the client sends next.
      payload:
        $ref: '#/components/schemas/Welcome'
    ack:
      name: ack
      title: Ack
      summary: A batch is stored. The client may delete it from its queue.
      payload:
        $ref: '#/components/schemas/Ack'
    error:
      name: error
      title: Error
      summary: A recoverable problem with one client message.
      payload:
        $ref: '#/components/schemas/Error'

    subscribe:
      name: subscribe
      title: Subscribe
      summary: Watch one trip.
      payload:
        $ref: '#/components/schemas/Subscribe'
    subscribed:
      name: subscribed
      title: Subscribed
      summary: Watching started; the trip as it is now.
      payload:
        $ref: '#/components/schemas/Subscribed'
    driver_position:
      name: driver_position
      title: Driver position
      summary: Where the driver is now.
      payload:
        $ref: '#/components/schemas/DriverPosition'
    trip_progress:
      name: trip_progress
      title: Trip progress
      summary: Distance to the target and the expected time of arrival.
      payload:
        $ref: '#/components/schemas/TripProgress'
    trip_event:
      name: trip_event
      title: Trip event
      summary: The trip moved to another stage.
      payload:
        $ref: '#/components/schemas/TripEvent'
    route_updated:
      name: route_updated
      title: Route updated
      summary: The driver follows a new route from now on; draw it instead of the old one. Sent to the guest and the driver.
      payload:
        $ref: '#/components/schemas/RouteUpdated'

    fleet_subscribe:
      name: fleet_subscribe
      title: Fleet subscribe
      summary: Watch the drivers inside a map area.
      payload:
        $ref: '#/components/schemas/FleetSubscribe'
    fleet_snapshot:
      name: fleet_snapshot
      title: Fleet snapshot
      summary: Every matching driver in the area now.
      payload:
        $ref: '#/components/schemas/FleetSnapshot'
    fleet_delta:
      name: fleet_delta
      title: Fleet delta
      summary: The markers that changed since the last message, and the drivers that left.
      payload:
        $ref: '#/components/schemas/FleetDelta'
    fleet_cluster:
      name: fleet_cluster
      title: Fleet cluster
      summary: Driver counts per grid cell, for an area with too many drivers to send one by one.
      payload:
        $ref: '#/components/schemas/FleetCluster'

  schemas:
    Subscribe:
      type: object
      additionalProperties: false
      required: [type, tripId]
      properties:
        type:
          const: subscribe
        tripId:
          type: string
          format: uuid

    Subscribed:
      type: object
      additionalProperties: false
      required: [type, trip]
      properties:
        type:
          const: subscribed
        trip:
          $ref: '#/components/schemas/GuestTrip'

    GuestTrip:
      type: object
      additionalProperties: false
      required: [tripId, status, pickup, destination, updatedAt]
      properties:
        tripId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TripStatus'
        pickup:
          $ref: '#/components/schemas/Point'
        destination:
          $ref: '#/components/schemas/Point'
        driverId:
          type: string
          format: uuid
          description: Absent until a driver accepts the trip.
        updatedAt:
          type: string
          format: date-time
        route:
          $ref: '#/components/schemas/GuestRoute'

    GuestRoute:
      type: object
      additionalProperties: false
      required: [kind, routeVersion, polyline, distanceM, durationS]
      description: >-
        The route the driver follows now, the one trip_progress measures on: APPROACH (driver to pickup) before
        the ride, TRIP (pickup to destination) during it. Absent from the trip when there is none.
      properties:
        kind:
          type: string
          enum: [TRIP, APPROACH]
        routeVersion:
          type: integer
          minimum: 1
        polyline:
          type: string
          description: Google Encoded Polyline, precision 5.
        distanceM:
          type: number
          minimum: 0
        durationS:
          type: number
          minimum: 0

    RouteUpdated:
      type: object
      additionalProperties: false
      required: [type, tripId, kind, routeVersion, polyline, distanceM, durationS, reason]
      properties:
        type:
          const: route_updated
        tripId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [TRIP, APPROACH]
        routeVersion:
          type: integer
          minimum: 1
          description: Later trip_progress messages with this routeVersion measure along this route.
        polyline:
          type: string
          description: Google Encoded Polyline, precision 5.
        distanceM:
          type: number
          minimum: 0
        durationS:
          type: number
          minimum: 0
        reason:
          type: string
          description: >-
            Why the client gets this route. `initial`: the first plan of its kind (the APPROACH route, planned
            from the driver's first fix after accept). `status_changed`: the ride started, so the TRIP route takes
            over. `off_route`: the driver left the previous version. A later server may add values, so a client
            ignores values it does not know.

    TripStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]

    Point:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    DriverPosition:
      type: object
      additionalProperties: false
      required: [type, tripId, lat, lng, recordedAt]
      properties:
        type:
          const: driver_position
        tripId:
          type: string
          format: uuid
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        bearingDeg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Degrees, 0 = north. Rotate the car marker with it.
        speedMps:
          type: number
          minimum: 0
        recordedAt:
          type: string
          format: date-time

    TripProgress:
      type: object
      additionalProperties: false
      required: [type, tripId, target, remainingM, etaS, basis]
      properties:
        type:
          const: trip_progress
        tripId:
          type: string
          format: uuid
        target:
          type: string
          enum: [PICKUP, DESTINATION]
          description: PICKUP while the driver comes to the guest, DESTINATION during the ride.
        remainingM:
          type: number
          minimum: 0
        etaS:
          type: number
          minimum: 0
          description: >-
            Seconds until arrival at the target. With basis ROUTE, the route's planned time for the distance left,
            scaled by the driver's smoothed speed against the plan (0.5 to 3 times). With STRAIGHT_LINE, distance
            divided by the smoothed speed (at least 2 m/s).
        basis:
          type: string
          enum: [STRAIGHT_LINE, ROUTE]
          description: >-
            ROUTE when remainingM is measured along the planned road, STRAIGHT_LINE when the trip has no route for
            this stage.
        routeVersion:
          type: integer
          minimum: 1
          description: With basis ROUTE, the version of the route remainingM is measured on.

    TripEvent:
      type: object
      additionalProperties: false
      required: [type, tripId, event, status, at]
      properties:
        type:
          const: trip_event
        tripId:
          type: string
          format: uuid
        event:
          type: string
          enum: [status_changed, driver_arriving, driver_low_battery, driver_stale, driver_back, off_route]
          description: >-
            What happened. `status_changed`: the trip moved to `status`. `driver_arriving`: the driver came within
            200 m of the pickup (2 fixes in a row); sent again only after the driver went beyond 300 m.
            `driver_low_battery`: the driver's phone is at 15 % or less and not charging, or its profile is
            CRITICAL; sent again only after it reached 25 % or was charging. `driver_stale`: nothing came from the
            driver's phone for 60 s (connection lost). `driver_back`: the phone is heard again; it follows every
            `driver_stale`, never two `driver_stale` in a row. `off_route` (phase 7): the driver left the planned
            route and the server planned again; a `route_updated` follows when it found a new route. A later
            server may add values, so a client ignores values it does not know.
        status:
          $ref: '#/components/schemas/TripStatus'
          description: The trip's stage when the event happened.
        at:
          type: string
          format: date-time
        remainingM:
          type: number
          minimum: 0
          description: '`driver_arriving` only: the straight-line distance to the pickup, in meters.'
        levelPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: '`driver_low_battery` only: the battery level of the driver''s phone.'
        lastSeenAt:
          type: string
          format: date-time
          description: '`driver_stale` only: when the server last heard from the driver''s phone.'

    Hello:
      type: object
      additionalProperties: false
      required: [type, protocolVersion, deviceId, sessionId, sdkVersion]
      properties:
        type:
          const: hello
        protocolVersion:
          type: integer
          description: Version 1 is the only supported version. Any other value closes the socket with 4400.
        deviceId:
          type: string
          minLength: 1
          description: Stable id of the device. The driver is identified by the access token, not by this id.
        sessionId:
          type: string
          format: uuid
          description: Generated by the SDK when tracking starts. Stays the same across reconnects.
        lastAckedSeq:
          type: integer
          minimum: 1
          description: Highest seq that the client received an ack for. Absent before the first ack. Informational only.
        sdkVersion:
          type: string
        device:
          $ref: '#/components/schemas/Device'

    Device:
      type: object
      additionalProperties: false
      description: >-
        The phone the session runs on (phase 9), for comparing location stacks across devices and ROMs. Optional,
        and so is every field: an older SDK sends no block. The first hello of a session sets it; a later hello
        with a block replaces it.
      properties:
        manufacturer:
          type: string
          maxLength: 64
          description: Build.MANUFACTURER, for example Google.
        model:
          type: string
          maxLength: 64
          description: Build.MODEL, for example Pixel 7.
        androidSdk:
          type: integer
          minimum: 1
          description: Build.VERSION.SDK_INT, the Android API level.
        rom:
          type: string
          maxLength: 64
          description: The ROM's name and version when it is not the stock one, for example LineageOS 22.1.
        hasGms:
          type: boolean
          description: Whether Google Play services is installed and usable.

    Command:
      type: object
      additionalProperties: false
      required: [type, commandId, kind]
      properties:
        type:
          const: command
        commandId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [SET_CONSTRAINT, REGISTER_GEOFENCES, FLUSH_QUEUE]
        maxAccuracy:
          type: string
          enum: [HIGH, BALANCED, LOW, PASSIVE]
        minIntervalMs:
          type: integer
          minimum: 0
        reason:
          type: string
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Geofence'

    Geofence:
      type: object
      additionalProperties: false
      required: [id, lat, lng, radiusM]
      properties:
        id:
          type: string
        lat:
          type: number
        lng:
          type: number
        radiusM:
          type: number
          exclusiveMinimum: 0

    CommandAck:
      type: object
      additionalProperties: false
      required: [type, commandId, result]
      properties:
        type:
          const: command_ack
        commandId:
          type: string
          format: uuid
        result:
          type: string
          enum: [applied, rejected]
        reason:
          type: string

    DeviceStatus:
      type: object
      additionalProperties: false
      required: [type, at, battery]
      properties:
        type:
          const: device_status
        at:
          type: string
          format: date-time
          description: When the device read these values.
        battery:
          $ref: '#/components/schemas/Battery'
        motion:
          type: string
          description: The detected activity (STILL, WALKING, IN_VEHICLE, ...). Absent when unknown.

    Battery:
      type: object
      additionalProperties: false
      required: [levelPercent, isCharging]
      properties:
        levelPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Another value gets `error{INVALID_MESSAGE}`; the session stays open.
        isCharging:
          type: boolean
        temperatureC:
          type: number
        profile:
          type: string
          description: The SDK's battery profile name, for example CRITICAL. Unknown names count as normal.

    FixBatch:
      type: object
      additionalProperties: false
      required: [type, seq, fixes]
      properties:
        type:
          const: fix_batch
        seq:
          type: integer
          minimum: 1
          description: 1 for the first batch of a session, +1 for each new batch. A resend keeps its seq and its content.
        fixes:
          type: array
          minItems: 1
          description: At most `welcome.limits.maxFixesPerBatch` fixes.
          items:
            $ref: '#/components/schemas/Fix'

    Fix:
      type: object
      additionalProperties: false
      required: [lat, lng, accuracyM, recordedAt]
      description: |
        One position as the device measured it. A fix with a value outside these ranges is rejected
        with reason INVALID_VALUE in the ack. The rest of the batch is still stored.
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: WGS 84 degrees.
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: WGS 84 degrees.
        accuracyM:
          type: number
          exclusiveMinimum: 0
          description: Horizontal accuracy radius in meters (68% confidence).
        speedMps:
          type: number
          minimum: 0
        speedAccuracyMps:
          type: number
          minimum: 0
        bearingDeg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Degrees, 0 = north.
        bearingAccuracyDeg:
          type: number
          minimum: 0
        altitudeM:
          type: number
        verticalAccuracyM:
          type: number
          minimum: 0
        recordedAt:
          type: string
          format: date-time
          description: UTC time at which the device recorded the fix (device clock).
        provider:
          type: string
          enum: [GMS_FUSED, AOSP_GPS, AOSP_NETWORK, AOSP_FUSED, UNKNOWN]
          default: UNKNOWN
          description: The location stack that produced the fix. The server reads an unknown value as UNKNOWN.
        mock:
          type: boolean
          default: false
          description: The OS marked the fix as coming from a mock location provider. Such a fix is rejected with MOCK_LOCATION.
        satellites:
          $ref: '#/components/schemas/Satellites'

    Satellites:
      type: object
      additionalProperties: false
      required: [usedInFix]
      description: Absent for fixes that did not come from GNSS (Wi-Fi, cell).
      properties:
        usedInFix:
          type: integer
          minimum: 0
        meanCn0DbHz:
          type: number
          minimum: 0
          description: Mean carrier-to-noise density of the satellites used in the fix.

    Welcome:
      type: object
      additionalProperties: false
      required: [type, sessionId, resumeFromSeq, serverTime, limits]
      properties:
        type:
          const: welcome
        sessionId:
          type: string
          format: uuid
        resumeFromSeq:
          type: integer
          minimum: 1
          description: The highest seq that the server has stored for this session, plus 1. It wins over `hello.lastAckedSeq`.
        serverTime:
          type: string
          format: date-time
        limits:
          $ref: '#/components/schemas/Limits'

    Limits:
      type: object
      additionalProperties: false
      required: [maxFixesPerBatch, maxFrameBytes, maxMessagesPerSecond]
      properties:
        maxFixesPerBatch:
          type: integer
          minimum: 1
        maxFrameBytes:
          type: integer
          minimum: 1
          description: A larger frame closes the socket with 1009.
        maxMessagesPerSecond:
          type: integer
          minimum: 1
          description: Messages above this rate are dropped with error RATE_LIMITED.

    Ack:
      type: object
      additionalProperties: false
      required: [type, seq, accepted, rejected]
      properties:
        type:
          const: ack
        seq:
          type: integer
          minimum: 1
        accepted:
          type: integer
          minimum: 0
          description: How many fixes of the batch passed the pipeline.
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/Rejection'

    Rejection:
      type: object
      additionalProperties: false
      required: [index, reason]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the fix in `fix_batch.fixes`, as the client sent it.
        reason:
          type: string
          enum:
            - INVALID_VALUE
            - MOCK_LOCATION
            - POOR_ACCURACY
            - FUTURE_TIMESTAMP
            - TOO_OLD
            - DUPLICATE_TIMESTAMP
            - IMPLAUSIBLE_JUMP

    Error:
      type: object
      additionalProperties: false
      required: [type, code, message]
      properties:
        type:
          const: error
        code:
          type: string
          enum:
            - MALFORMED_MESSAGE
            - INVALID_MESSAGE
            - UNKNOWN_MESSAGE
            - RATE_LIMITED
            - EMPTY_BATCH
            - BATCH_TOO_LARGE
            - INVALID_SEQ
            - SESSION_DEVICE_MISMATCH
            - TRIP_NOT_FOUND
          description: |
            MALFORMED_MESSAGE: the frame is not valid JSON.
            INVALID_MESSAGE: valid JSON, but the wrong shape or missing fields.
            UNKNOWN_MESSAGE: a `type` that this endpoint does not know.
            RATE_LIMITED: more messages per second than allowed; this message was dropped.
            EMPTY_BATCH, BATCH_TOO_LARGE, INVALID_SEQ: the batch was not stored and gets no ack.
            SESSION_DEVICE_MISMATCH: the hello names a session that another device or driver started. Start a
            new session (new sessionId) and send hello again.
            TRIP_NOT_FOUND (guest socket): no such trip, or one this guest may not see.
            INVALID_MESSAGE is also the answer to a hello with an invalid sessionId or deviceId, and to a
            second hello on the same socket.
        message:
          type: string
          description: For humans and logs. May change between versions.
        correlatesTo:
          type: integer
          description: The seq of the client message that this error is about, if it has one.

    FleetSubscribe:
      type: object
      additionalProperties: false
      required: [type, bbox]
      properties:
        type:
          const: fleet_subscribe
        bbox:
          type: array
          description: '[minLng, minLat, maxLng, maxLat]. Edges are inside. The minimum comes first. An area across the antimeridian is not supported.'
          minItems: 4
          maxItems: 4
          items:
            type: number
        filters:
          $ref: '#/components/schemas/FleetFilters'

    FleetFilters:
      type: object
      additionalProperties: false
      description: An absent or null field does not filter.
      properties:
        online:
          type: [boolean, 'null']
          description: true for only drivers heard from within the stale time (60 s), false for only the others.
        onTrip:
          type: [boolean, 'null']
          description: true for only drivers on a trip, false for only the others.

    FleetSnapshot:
      type: object
      additionalProperties: false
      required: [type, drivers, at]
      properties:
        type:
          const: fleet_snapshot
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/DriverMarker'
        at:
          type: string
          format: date-time
          description: The server time that `online` was judged against.

    FleetDelta:
      type: object
      additionalProperties: false
      required: [type, upserts, removes, at]
      properties:
        type:
          const: fleet_delta
        upserts:
          type: array
          description: Markers to add or replace.
          items:
            $ref: '#/components/schemas/DriverMarker'
        removes:
          type: array
          description: Drivers to take off the map. They left the area or stopped matching the filters.
          items:
            type: string
            format: uuid
        at:
          type: string
          format: date-time

    FleetCluster:
      type: object
      additionalProperties: false
      required: [type, cells, cellDeg, total, at]
      properties:
        type:
          const: fleet_cluster
        cells:
          type: array
          description: Only cells with at least one driver.
          items:
            $ref: '#/components/schemas/FleetCell'
        cellDeg:
          type: number
          exclusiveMinimum: 0
          description: The side of one grid cell, in degrees of latitude and of longitude.
        total:
          type: integer
          minimum: 0
          description: Matching drivers in the area.
        at:
          type: string
          format: date-time

    FleetCell:
      type: object
      additionalProperties: false
      required: [lat, lng, count]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: The mean latitude of the drivers in the cell.
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: The mean longitude of the drivers in the cell.
        count:
          type: integer
          minimum: 1

    DriverMarker:
      type: object
      additionalProperties: false
      required: [driverId, lat, lng, online, lastSeenAt]
      properties:
        driverId:
          type: string
          format: uuid
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        bearingDeg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Degrees, 0 = north. Absent when the newest fix had no bearing.
        online:
          type: boolean
          description: Heard from within the stale time (60 s).
        tripStatus:
          type: string
          description: The stage of the driver's current trip. Absent when they are not on one.
        batteryPct:
          type: integer
          minimum: 0
          maximum: 100
        lastSeenAt:
          type: string
          format: date-time
          description: When the phone last told the server something, by the phone's clock.
