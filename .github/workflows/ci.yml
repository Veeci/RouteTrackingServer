name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and dependencies between runs; writes the cache only from main.
      - uses: gradle/actions/setup-gradle@v6

      # The staging deploy scripts (phase 1.5). shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Shellcheck
        run: shellcheck deploy/staging/deploy.sh deploy/staging/backup.sh

      # Lint (spotless, detekt) + unit, integration (Testcontainers: runners have Docker) and e2e suites.
      - name: Check
        run: ./gradlew check koverXmlReport --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # The admin dashboard (phase 12b, choice C2). It runs on every PR with no path filter, so it can be a required
  # check: a skipped required job would block a Kotlin-only PR.
  admin-web:
    name: Admin web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: admin-web/.nvmrc
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      # Exact versions from package-lock.json.
      - name: Install
        run: npm ci --no-audit --no-fund

      # TC-12-CON-01: types from this commit's rts-v1.yaml. The typecheck below fails when the app, or a typed MSW
      # mock, no longer matches the contract.
      - name: Generate API types
        run: npm run generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Unit and component tests, with the 80 % line gate on src/api and src/auth.
      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  # The dashboard against a real server from this commit (phase 12b, choice C3). Not a required check yet: it stays
  # optional for about a week while it proves stable.
  admin-web-e2e:
    name: Admin web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rts
          POSTGRES_USER: rts
          POSTGRES_PASSWORD: e2e-only   # a throwaway database that lives as long as this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rts -d rts"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The identity provider for the real login (12g): Keycloak in dev mode, with the realm, its client and three test
      # users from deploy/keycloak/rts-realm.json. A step, not a service container, because a service cannot be given
      # the `start-dev --import-realm` command. It starts while Gradle builds and is waited for before the server.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            -e KC_HOSTNAME=http://localhost:8180 \
            -v "$PWD/deploy/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm

      - name: Build the server and the simulator
        run: ./gradlew :app:installDist :tools:simulator:installDist

      # APP_ENV=test mounts the dev-token route and migrates on start. CI has no map of Hanoi, so the server loads the
      # test fixture graph that the app's own tests use (a grid in Ho Chi Minh City, 68 nodes). Booking a trip plans a
      # road route, and TC-12-E2E-04 books one inside that grid. The graph loads in milliseconds and the binary cache is
      # off, so the job waits for /health/ready, which also checks the graph. The JWT secret is new for every run and
      # never reaches the log. The 50 simulated drivers, the browser (through the preview proxy) and the tests
      # all reach the server from 127.0.0.1, so they share one per-IP rate limit. Each driver asks for a token and
      # opens a socket at start and on every reconnect, so the default 300 a minute is too tight.
      - name: Start the server
        env:
          APP_ENV: test
          DB_URL: jdbc:postgresql://localhost:5432/rts
          DB_USER: rts
          DB_PASSWORD: e2e-only
          HTTP_RATELIMITPERMINUTE: "3000"
          ROUTING_GRAPHPATH: app/src/testFixtures/resources/graphs/saigon_test_grid.osm
          ROUTING_GRAPHCACHEDIR: ""
          # RS256 tokens from Keycloak next to the HS256 dev tokens. The dev login still works, so every other test is
          # unchanged.
          OIDC_ISSUER: http://localhost:8180/realms/rts
        run: |
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors \
            http://localhost:8180/realms/rts/.well-known/openid-configuration > /dev/null
          JWT_SECRET="$(openssl rand -hex 32)" nohup app/build/install/app/bin/app > server.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health/ready

      # 50 drivers that loop Hanoi routes and answer every command with `applied`. TC-12-E2E-01 waits until all 50 are
      # online and counts them on the map; TC-12-E2E-03 sends a command to one. They run longer than the job may, so
      # nothing waits for them to stop. The tests wait with expect.poll.
      - name: Start the simulator
        run: |
          nohup tools/simulator/build/install/simulator/bin/simulator fleet --drivers 50 --dashboards 0 --duration 30m \
            > simulator.log 2>&1 &

      - uses: actions/setup-node@v7
        with:
          node-version-file: admin-web/.nvmrc
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        working-directory: admin-web
        run: |
          npm ci --no-audit --no-fund
          npm run generate
          npx playwright install --with-deps chromium

      # Builds the app, serves it with `vite preview` (production headers, proxy to :8080) and runs Playwright. The map
      # test answers the tile host's requests itself, so the job never depends on OpenFreeMap.
      - name: E2E
        working-directory: admin-web
        env:
          # Turns on the `oidc` project: a second build with the real login, on port 4174 (12g).
          RTS_E2E_OIDC_ISSUER: http://localhost:8180/realms/rts
        run: npm run e2e

      - name: Keep Keycloak's log
        if: failure()
        run: docker logs keycloak > keycloak.log 2>&1 || true

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-web-e2e
          path: |
            admin-web/playwright-report/
            admin-web/test-results/
            server.log
            simulator.log
            keycloak.log
          retention-days: 7

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push to GHCR (only used on main)
    env:
      IMAGE: ghcr.io/veeci/route-tracking-server
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=main,enable={{is_default_branch}}

      # PRs: build only (proves the Dockerfile works). main: build and push :<sha> and :main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
