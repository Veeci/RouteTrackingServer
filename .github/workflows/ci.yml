name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and dependencies between runs; writes the cache only from main.
      - uses: gradle/actions/setup-gradle@v6

      # The staging deploy scripts (phase 1.5). shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Shellcheck
        run: shellcheck deploy/staging/deploy.sh deploy/staging/backup.sh

      # Lint (spotless, detekt) + unit, integration (Testcontainers: runners have Docker) and e2e suites.
      - name: Check
        run: ./gradlew check koverXmlReport --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # TC-11-CI-01: TypeScript types for the admin dashboard, generated from the OpenAPI contract with a pinned
  # openapi-typescript, then compiled with tsc together with clients/ts/usage.ts, which uses a few endpoint types.
  # The result is a build artifact named after the commit; the dashboard repo pins one. Nothing goes to npm.
  ts-client:
    name: TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json

      # Exact versions from package-lock.json: openapi-typescript 7.13.0, typescript 5.9.3.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate
        run: npm run generate

      - name: Compile
        run: npm run check

      - name: Upload client
        uses: actions/upload-artifact@v7
        with:
          name: rts-client-${{ github.sha }}
          path: |
            clients/ts/generated/rts-v1.ts
            app/src/main/resources/openapi/rts-v1.yaml
          retention-days: 90

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push to GHCR (only used on main)
    env:
      IMAGE: ghcr.io/veeci/route-tracking-server
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=main,enable={{is_default_branch}}

      # PRs: build only (proves the Dockerfile works). main: build and push :<sha> and :main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
