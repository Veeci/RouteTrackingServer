# Deploys every image CI pushes from main to the staging laptop (phase 1.5, docs/ops/staging-setup.md).
# Both jobs skip themselves until the repository variable STAGING_URL exists, that is, until the manual setup
# (T1b.6) is done. Job-level `if` cannot read environment variables, so STAGING_URL must be a repository variable.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full commit SHA of an image already in GHCR (manual deploy or rollback)
        required: true

# Deploys run one at a time, in order. A newer merge waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only after CI passed on a push to main. Without the event check, a pull request from a branch
    # that happens to be named "main" would also match.
    if: >-
      vars.STAGING_URL != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.event.workflow_run.head_sha }}
      # The dashboard's tailnet-only entry (12f): `tailscale serve` on port 8443 of the same name as the Funnel URL.
      ADMIN_URL: ${{ vars.STAGING_URL }}:8443
    steps:
      # The SHA ends up in a remote shell command, so only a full commit SHA is accepted.
      - name: Check the SHA
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_sha must be a full 40-character commit SHA"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}   # deploy files from the same commit as the image

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH key and known host
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        run: >-
          scp deploy/staging/compose.yml deploy/staging/deploy.sh deploy/staging/backup.sh
          deploy/staging/smoke-admin-web.sh deploy@rts-staging:/srv/rts/

      # deploy.sh also smoke-tests the dashboard on the laptop, and rolls both images back if it fails.
      - name: Deploy
        run: ssh deploy@rts-staging "bash /srv/rts/deploy.sh $SHA"

      # The same checks from this runner, which is in the tailnet as tag:ci: tailscale serve, its certificate and the
      # access policy's grant to port 8443. No SHA: a manual deploy of a commit from before 12f keeps an older dashboard.
      - name: Admin web through tailscale serve
        run: bash deploy/staging/smoke-admin-web.sh "$ADMIN_URL"

      # TC-12-HOST-04 in a real browser: login, the live map, its worker and the fleet socket. It needs the staging
      # access token for the dev login, so it runs only once the secret STAGING_ACCESS_TOKEN exists in this environment.
      - name: Check for the staging token
        id: token
        env:
          STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
        run: echo "present=$([ -n "$STAGING_ACCESS_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: admin-web/.nvmrc
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Browser smoke test
        if: steps.token.outputs.present == 'true'
        working-directory: admin-web
        env:
          RTS_SMOKE_URL: ${{ env.ADMIN_URL }}
          RTS_STAGING_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload the browser report
        if: failure() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staging-smoke
          path: |
            admin-web/playwright-report/
            admin-web/test-results/
          retention-days: 7

  smoke:
    # A separate job on a fresh runner that is NOT in the tailnet, so the request takes the public Funnel path.
    # Inside the tailnet, MagicDNS would resolve the name to the private address and skip Funnel.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.event.workflow_run.head_sha }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Readiness through Funnel
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$STAGING_URL/health/ready"

      - name: Summary
        if: always()
        env:
          SMOKE: ${{ job.status }}
        run: |
          echo "Staging $STAGING_URL runs \`$SHA\` (smoke $SMOKE)" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard (tailnet only): $STAGING_URL:8443" >> "$GITHUB_STEP_SUMMARY"
