# Weekly dependency update PRs. Minor/patch updates are grouped to keep the PR count low;
# majors arrive one per PR so each can be reviewed on its own.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly

  # The admin dashboard (phase 12b). Exact pins in package-lock.json; Dependabot proposes each bump.
  - package-ecosystem: npm
    directory: "/admin-web"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript 7.13 needs TypeScript ^5 and typescript-eslint 8.73 needs <6.1. Bump it by hand once both allow it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Node types must match the runtime in admin-web/.nvmrc (24). Bump them together with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
