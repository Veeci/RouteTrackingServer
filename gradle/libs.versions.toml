# Single source of truth for dependency versions.
# Ktor artifacts come from the official `ktorLibs` catalog (settings.gradle.kts), which keeps all Ktor modules aligned.
# Everything else lives here. Versions checked against Maven Central / Gradle Plugin Portal on 2026-09-30.
# Entries are grouped by concern; the comment on each group says the phase that first uses it.

[versions]
kotlin = "2.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
koin = "4.2.2"
hoplite = "3.0.0"
exposed = "1.5.0"
flyway = "13.8.1"
hikari = "7.1.0"
postgres = "42.7.13"
lettuce = "7.8.0.RELEASE"
logback = "1.6.4"
logstash = "9.0"
micrometer = "1.17.1"
junit = "6.1.3"
kotest = "6.2.5"
mockk = "1.14.11"
turbine = "1.2.1"
testcontainers = "2.0.5"
konsist = "0.17.3"
openapi-validator = "3.0.0"
spotless = "8.10.3"
detekt = "1.23.8"
kover = "0.9.11"

[libraries]
# Kotlin (phase 0+)
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# DI and config (phase 1)
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j" }
koin-test-junit5 = { module = "io.insert-koin:koin-test-junit5" }
hoplite-core = { module = "com.sksamuel.hoplite:hoplite-core", version.ref = "hoplite" }
hoplite-hocon = { module = "com.sksamuel.hoplite:hoplite-hocon", version.ref = "hoplite" }

# Persistence (phase 1)
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }

# Redis (phase 10)
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# Observability (phase 1)
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Testing (phase 0+)
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
openapi-validator = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "openapi-validator" }

[bundles]
exposed = ["exposed-core", "exposed-jdbc", "exposed-kotlin-datetime", "exposed-json"]
unit-test = ["junit-jupiter", "kotest-assertions", "kotest-property", "kotlinx-coroutines-test"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
