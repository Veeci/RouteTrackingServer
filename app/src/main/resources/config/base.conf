app {
    version = "local"
}

http {
    port = 8080
    maxBodyBytes = 1048576    # 1 MiB
    rateLimitPerMinute = 300  # per client IP
    shutdownGracePeriod = 2s
    shutdownTimeout = 8s      # Docker sends SIGKILL 10 s after SIGTERM
}

db {
    maxPoolSize = 10
    migrateOnStart = false
}

ws {
    pingPeriod = 15s
    timeout = 15s
    maxFrameBytes = 65536    # 64 KiB
    messagesPerSecond = 20   # per session
}

jwt {
    # secret: from the JWT_SECRET environment variable only (deploy/.env locally).
    issuer = "rts"
    audience = "rts-api"
    tokenTtl = 12h
    leeway = 30s
}

events {
    relayInterval = 250ms
    relayBatchSize = 100
    staleAfter = 60s       # two missed device_status heartbeats (every 30 s)
    staleCheckEvery = 10s
}

tracking {
    handshakeTimeout = 10s
    maxFixesPerBatch = 100
    maxAccuracyM = 50
    maxClockSkew = 30s
    maxAge = 24h
    maxSpeedMps = 70        # 252 km/h
    rejectMock = true
}
