app {
    version = "local"
}

http {
    port = 8080
    maxBodyBytes = 1048576    # 1 MiB
    rateLimitPerMinute = 300  # per client IP
    shutdownGracePeriod = 2s
    shutdownTimeout = 8s      # Docker sends SIGKILL 10 s after SIGTERM
}

db {
    maxPoolSize = 20      # per instance; with relayPoolSize, keep instances × 22 under Postgres max_connections (100)
    relayPoolSize = 2     # the outbox relay's own pool (load check 11)
    migrateOnStart = false
}

ws {
    pingPeriod = 15s
    timeout = 15s
    maxFrameBytes = 65536    # 64 KiB
    messagesPerSecond = 20   # per session
}

jwt {
    # secret: from the JWT_SECRET environment variable only (deploy/.env locally).
    issuer = "rts"
    audience = "rts-api"
    tokenTtl = 12h
    leeway = 30s
}

events {
    relayInterval = 250ms
    relayBatchSize = 100
    staleAfter = 60s       # two missed device_status heartbeats (every 30 s)
    staleCheckEvery = 10s
}

commands {
    expireAfter = 10m       # a command not acked by then is never sent
    expiryCheckEvery = 30s
}

telemetry {
    computeEvery = 5m       # the session health job
    idleAfter = 10m         # a session silent this long gets its health computed
    batchSize = 100
    defaultInterval = 5s    # the SDK's fix interval without a SET_CONSTRAINT
}

tracking {
    handshakeTimeout = 10s
    maxFixesPerBatch = 100
    maxAccuracyM = 50
    maxClockSkew = 30s
    maxAge = 24h
    maxSpeedMps = 70        # 252 km/h
    rejectMock = true
}

routing {
    graphPath = "data/osm/hanoi.osm"  # gitignored; see docs/data/osm.md
    maxSnapDistanceM = 300
    coverageMarginM = 1000
    planTimeout = 500ms
}

admin {
    origins = []            # ADMIN_ORIGINS, comma separated; empty: no CORS
}

fleet {
    tick = 2s               # one read of the changed drivers per instance per tick
    maxMarkers = 5000       # beyond this an area is sent as cluster counts
    sendTimeout = 5s        # a slower socket is closed with 1013
}
