db {
    maxPoolSize = 4
    migrateOnStart = true
}

tracking {
    handshakeTimeout = 300ms  # tests of the handshake timeout should not wait 10 s
}

events {
    relayInterval = 20ms  # live updates in tests arrive within a few frames
}

fleet {
    tick = 100ms  # fleet socket tests wait a few ticks, not a few seconds
    heardFlush = 100ms  # and a driver's heard_at within a few ticks too
}
