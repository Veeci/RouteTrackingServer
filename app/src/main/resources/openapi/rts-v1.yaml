openapi: 3.1.0
info:
  title: RouteTracking Server API
  version: 1.0.0
  description: |
    REST API of the RouteTracking backend.

    - Errors use RFC 9457 Problem Details (`application/problem+json`, schema `Problem`). Clients branch on `code`.
    - Every request gets an `X-Request-Id` response header (the caller's own id is kept when it is safe);
      `Problem.traceId` repeats it so a bug report can be matched to the server logs.
    - Every route is rate limited per client IP; over the limit answers 429 with `Retry-After`.
    - Real-time traffic uses WebSockets, specified separately (AsyncAPI, phase 2).

    This file is the contract: it is written before the code, and API tests fail when a response does not match it.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: operations
    description: Probes and metrics for the hosting platform, not for app users.
paths:
  /health/live:
    get:
      tags: [operations]
      operationId: getLiveness
      summary: Liveness probe
      description: 200 whenever the process can answer. Checks no dependencies, so a database outage never restarts the process.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /health/ready:
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Whether this instance should receive traffic now. Runs every dependency check in parallel with a
        2-second deadline. 503 while a dependency is down or while the instance is shutting down.
      responses:
        '200':
          description: Ready; every check is UP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '503':
          description: Not ready; at least one check is DOWN, or shutdown has begun.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /metrics:
    get:
      tags: [operations]
      operationId: getMetrics
      summary: Prometheus metrics
      description: All metrics in the Prometheus text exposition format (HTTP timers, JVM, connection pool, WebSocket sessions).
      responses:
        '200':
          description: Metrics page.
          content:
            text/plain:
              schema: { type: string }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token. Issued from phase 3; operations endpoints need none.
  responses:
    TooManyRequests:
      description: Rate limit exceeded for this client IP.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    HealthStatus:
      type: string
      enum: [UP, DOWN]
    HealthReport:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        checks:
          description: One entry per dependency check (readiness only).
          type: object
          additionalProperties: { $ref: '#/components/schemas/HealthStatus' }
    Problem:
      description: RFC 9457 Problem Details plus this API's `code`, `traceId` and `errors` members.
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          description: Identifies the error type; the same for every occurrence.
          type: string
          examples: ['urn:rts:error:trip-not-found']
        title:
          description: Short human summary of the type.
          type: string
        status:
          description: The HTTP status code, repeated.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: What went wrong this time, for humans.
          type: string
        instance:
          description: The request path the problem is about.
          type: string
        code:
          description: Machine-readable error code; clients branch on it. Never renamed once released.
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [TRIP_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED]
        traceId:
          description: Equals the response's X-Request-Id; quote it when reporting a problem.
          type: string
        errors:
          description: One entry per invalid field; only with code VALIDATION_FAILED.
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          description: The JSON field as the client sent it, e.g. `seats` or `stops[2].lat`.
          type: string
        message:
          type: string
