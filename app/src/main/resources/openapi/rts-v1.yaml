openapi: 3.1.0
info:
  title: RouteTracking Server API
  version: 1.0.0
  description: |
    REST API of the RouteTracking backend.

    - Errors use RFC 9457 Problem Details (`application/problem+json`, schema `Problem`). Clients branch on `code`.
    - Every request gets an `X-Request-Id` response header (the caller's own id is kept when it is safe);
      `Problem.traceId` repeats it so a bug report can be matched to the server logs.
    - Every route is rate limited per client IP; over the limit answers 429 with `Retry-After`.
    - Real-time traffic uses WebSockets, specified separately (AsyncAPI, phase 2).
    - Every response carries `X-Content-Type-Options: nosniff` and `Referrer-Policy: no-referrer`. Responses under
      `/api/v1/admin` also carry `Cache-Control: no-store`.
    - Only `/api/v1/admin` answers browsers on other origins (CORS), and only the origins the server is configured
      with (`ADMIN_ORIGINS`). Credentials are off: send the token in the Authorization header.
    - The admin paths (`/api/v1/admin`, and the `/ws/v1/admin` sockets) are served on the admin port when the server
      has one (`HTTP_ADMINPORT`, phase 12a), and the public port answers 404 for them. Every other path answers on
      both ports. Without an admin port everything is on one port. Staging puts the admin port on its private network
      only.

    This file is the contract: it is written before the code, and API tests fail when a response does not match it.
servers:
  - url: http://localhost:8080
    description: Local development. It serves the admin paths too unless the server has an admin port.
tags:
  - name: operations
    description: Probes and metrics for the hosting platform, not for app users.
  - name: identity
    description: Users and access tokens.
  - name: trips
    description: |
      Booking and running a trip. Every route needs a token. A guest sees only their own trips; a driver sees open
      trips and their own; another user's trip answers 404, the same as a trip that does not exist.
      Stages: REQUESTED → ACCEPTED → ARRIVED → IN_PROGRESS → COMPLETED, or CANCELLED before IN_PROGRESS.
  - name: admin
    description: Back-office endpoints for OPERATOR and ADMIN tokens; each route says which. Device commands (phase 5), the fleet view (phase 11).
  - name: routing
    description: |
      Road routes inside the city the server has a map for (phase 6). Points are snapped to the nearest road within
      300 m. Routing errors are 422 with code OUTSIDE_COVERAGE, NO_ROAD_NEARBY or NO_ROUTE_FOUND, and 503 with
      ROUTING_NOT_READY or ROUTING_TIMEOUT.
paths:
  /api/v1/dev/tokens:
    post:
      tags: [identity]
      operationId: issueDevToken
      summary: Create a user and an access token (dev and test only)
      description: |
        Creates a user with the given role, or reuses `userId`, and returns an access token for that user without
        any password. This route exists only when APP_ENV is dev or test; elsewhere it answers 404.
        Send the token as `Authorization: Bearer <token>` (WebSockets: the same header, or `?token=`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevTokenRequest' }
      responses:
        '200':
          description: The user and their token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips:
    post:
      tags: [trips]
      operationId: requestTrip
      summary: Book a trip (GUEST)
      description: |
        Creates a trip in stage REQUESTED with its road route from pickup to destination. Send a new random
        Idempotency-Key per booking: a retry with the same key and body returns the first response (header
        `Idempotent-Replayed: true`) and books nothing new. When no road route exists the booking fails with 422
        and no trip is created.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestTrip' }
      responses:
        '201':
          description: The trip was created.
          headers:
            Location:
              description: The URL of the new trip.
              schema: { type: string }
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            IDEMPOTENCY_KEY_REUSED, the key was used before for a different request; or no road route joins pickup
            and destination: OUTSIDE_COVERAGE, NO_ROAD_NEARBY or NO_ROUTE_FOUND.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/RoutingUnavailable' }
    get:
      tags: [trips]
      operationId: listOpenTrips
      summary: List open trips (DRIVER)
      description: Trips that wait for a driver, oldest first, one page at a time (keyset pagination).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: Only REQUESTED is supported.
          schema: { type: string, enum: [REQUESTED], default: REQUESTED }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: One page of trips.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}:
    get:
      tags: [trips]
      operationId: getTrip
      summary: Read a trip
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/accept:
    post:
      tags: [trips]
      operationId: acceptTrip
      summary: Accept an open trip
      description: "DRIVER. The caller becomes the trip's driver. A driver drives one trip at a time (409 DRIVER_ALREADY_ON_TRIP). Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/arrive:
    post:
      tags: [trips]
      operationId: arriveAtPickup
      summary: Mark the driver as arrived at the pickup
      description: "The assigned driver. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/start:
    post:
      tags: [trips]
      operationId: startTrip
      summary: Start the ride
      description: "The assigned driver, after arriving. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/complete:
    post:
      tags: [trips]
      operationId: completeTrip
      summary: Finish the ride
      description: "The assigned driver. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/cancel:
    post:
      tags: [trips]
      operationId: cancelTrip
      summary: Cancel the trip
      description: "The guest or the assigned driver, before the ride starts. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412). Staff get 403 here: they cancel with POST /api/v1/admin/trips/{id}/cancel and a reason."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/summary:
    get:
      tags: [trips]
      operationId: getTripSummary
      summary: The summary of a completed trip
      description: |
        For the guest, the assigned driver and admins. Computed when the trip completes, usually within a second;
        until then 404 SUMMARY_NOT_READY. The guest never gets `approach`, where the driver drove before the pickup.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200': { $ref: '#/components/responses/TripSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/track:
    get:
      tags: [trips]
      operationId: getTripTrack
      summary: The recorded track and timeline of an ended trip, for a replay
      description: |
        For the guest, the assigned driver and admins; anyone else gets 404. A trip that has not ended (COMPLETED
        or CANCELLED) gets 409 TRIP_NOT_ENDED. `points` holds the driver's accepted fixes of one leg, oldest first.
        `timeline` holds the whole trip, whatever the leg: the stages, the moments and every route version, in time
        order. The approach (where the driver drove before the pickup) is only for the driver and admins: a guest
        who asks for it gets 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/TrackLeg'
        - name: simplify
          in: query
          description: >-
            Douglas–Peucker tolerance in metres. Above 0, points closer than this to the simplified line are
            dropped; the first and the last always stay. The timeline is never simplified.
          schema: { type: number, minimum: 0, maximum: 50, default: 0 }
      responses:
        '200':
          description: The leg's points and the trip's timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripTrack' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/export.gpx:
    get:
      tags: [trips]
      operationId: exportTripGpx
      summary: One leg of an ended trip as GPX 1.1
      description: |
        The same callers, legs and errors as `/track`. The file is streamed one page of fixes at a time, so it
        starts quickly and needs little memory on a long trip. Every check runs before the first byte; a
        failure after that cuts the connection, and the client gets a truncated file.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/TrackLeg'
      responses:
        '200':
          description: 'The file, as an attachment named `trip-<id>.gpx`.'
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename=trip-6f1c2c1e-0f6a-4d43-9a3e-5b2f8c9d7e10.gpx'] }
          content:
            application/gpx+xml:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/export.geojson:
    get:
      tags: [trips]
      operationId: exportTripGeoJson
      summary: One leg of an ended trip as GeoJSON, with the timeline as points
      description: |
        The same callers, legs and errors as `/track`. The file is streamed one page of fixes at a time, so it
        starts quickly and needs little memory on a long trip. Every check runs before the first byte; a
        failure after that cuts the connection, and the client gets a truncated file. A FeatureCollection: the leg
        as a LineString (`[lng, lat]`), then one Point per timeline entry at the last fix at or before its time.
        A geometry is null when there is no such fix inside the leg, or when the leg has fewer than two fixes.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/TrackLeg'
      responses:
        '200':
          description: 'The file, as an attachment named `trip-<id>.geojson`.'
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename=trip-6f1c2c1e-0f6a-4d43-9a3e-5b2f8c9d7e10.geojson'] }
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/TrackFeatureCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/me/trips:
    get:
      tags: [trips]
      operationId: listMyTrips
      summary: The caller's own trips, newest first
      description: |
        A guest gets the trips they booked, a driver the trips they accepted, in every stage, one page at a time
        (keyset pagination). The token says whose trips: an admin has none and gets 403. An item never holds the
        track; `rideDistanceM` is there once the trip is completed and summarized.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: One page of the caller's trips.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripHistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/routes:
    get:
      tags: [routing]
      operationId: planRoute
      summary: Plan a road route between two points
      description: |
        The cheapest road route under `metric`. The polyline starts at `from`, follows the roads and ends at `to`;
        `distanceM` and `durationS` include the short legs between each point and its road.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          description: The start as `lat,lng` in degrees.
          schema: { type: string, examples: ['21.0285,105.8542'] }
        - name: to
          in: query
          required: true
          description: The end as `lat,lng` in degrees.
          schema: { type: string, examples: ['21.0368,105.8346'] }
        - name: metric
          in: query
          description: What the route minimises.
          schema: { type: string, enum: [distance, time], default: distance }
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: OUTSIDE_COVERAGE, NO_ROAD_NEARBY or NO_ROUTE_FOUND; `detail` names the point (`from` or `to`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/RoutingUnavailable' }
  /api/v1/admin/drivers/{driverId}/commands:
    post:
      tags: [admin]
      operationId: issueCommand
      summary: Send a command to a driver's device (ADMIN)
      description: |
        Stores the command at once and answers 202: the device gets it when it is connected, or right after its next
        `welcome`, and acks it over the driver socket. A command not acked within 10 minutes expires and is never sent.
        A new SET_CONSTRAINT replaces the driver's older ones that were not sent yet.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCommand' }
      responses:
        '202':
          description: The command is stored and waits for the device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            INVALID_COMMAND, the command breaks a rule of its kind, such as a geofence with no regions. Request
            validation catches most of these first and answers 400. This 422 comes from the domain's own check.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [admin]
      operationId: listCommands
      summary: A driver's newest commands and their statuses (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Up to 50 commands, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/trips/{id}/summary:
    post:
      tags: [admin]
      operationId: recomputeTripSummary
      summary: Compute a trip's summary again (ADMIN)
      description: Replaces the stored summary, for example after a fix in the calculation. 409 TRIP_NOT_ENDED for a trip that is not completed.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200': { $ref: '#/components/responses/TripSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/trips:
    get:
      tags: [admin]
      operationId: listAllTrips
      summary: Every trip, filtered and paged (OPERATOR, ADMIN)
      description: |
        Every trip in every stage, newest first: by `createdAt`, then by id, both descending. The filters combine. Paged
        by keyset, so a trip created while a client walks the pages never pushes another one onto two pages.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: Repeat it to ask for several stages (`status=ACCEPTED&status=ARRIVED`). Absent means every stage.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/TripStatus' }
        - { name: driverId, in: query, schema: { type: string, format: uuid }, description: 'Trips this driver accepted.' }
        - { name: guestId, in: query, schema: { type: string, format: uuid }, description: 'Trips this guest booked.' }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'Created at or after this time.' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'Created before this time. Must be after `from`.' }
        - { name: cursor, in: query, schema: { type: string }, description: 'nextCursor of the previous page.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: One page of trips.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/trips/{id}/cancel:
    post:
      tags: [admin]
      operationId: cancelTripAsOperator
      summary: Cancel a trip as an operator (OPERATOR, ADMIN)
      description: |
        Cancels a trip that has not ended, also a ride in progress, which the guest and the driver cannot cancel. The
        guest's socket and the driver's socket get `trip_event` CANCELLED with `cancelledBy: OPERATOR`. The reason is
        required and goes only to the audit log, as TRIP_CANCELLED, in the same transaction as the cancel. Clients never
        see it. A trip that has ended answers 409 ILLEGAL_TRANSITION.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCancelRequest' }
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: REASON_REQUIRED, the reason is missing or blank.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/sessions/{id}/health:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [admin]
      operationId: getSessionHealth
      summary: How one tracking session behaved (ADMIN)
      description: |
        The stored health of a session: fix cadence, accuracy, gaps, battery drain and provider mix (phase 9). The
        server computes it 10 to 15 minutes after the session's last message, and again if the session resumes.
        404 SESSION_HEALTH_NOT_FOUND until then.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionHealth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      operationId: recomputeSessionHealth
      summary: Compute a session's health now (ADMIN)
      description: Computes and stores the health from what the session sent so far, even while it is live. 404 SESSION_HEALTH_NOT_FOUND for an unknown session.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionHealth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/reports/providers:
    get:
      tags: [admin]
      operationId: getProviderReport
      summary: Compare location stacks across sessions (ADMIN)
      description: |
        Groups the computed session health of sessions that started in [from, to) by primary provider, Google Play
        services, ROM and Android SDK (phase 9). Each metric is the median over the group's sessions that have a
        value for it. A session appears once its health is computed, 10 to 15 minutes after its last message.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One entry per group, ordered by provider, GMS, ROM and SDK, with unknown values last.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/reports/providers.csv:
    get:
      tags: [admin]
      operationId: getProviderReportCsv
      summary: The provider report as CSV (ADMIN)
      description: |
        The same groups as the JSON report, as RFC 4180 CSV with a header row. Decimals use `.`, an unknown value is
        an empty cell, and a text cell that starts with `=`, `+`, `-` or `@` gets a leading `'`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: The report as a CSV download.
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename=providers-1793491200000-1794096000000.csv'] }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/drivers/{driverId}/disable:
    post:
      tags: [admin]
      operationId: disableDriver
      summary: Disable a driver (ADMIN)
      description: The driver can no longer open a tracking session; their open sockets on every instance close with 4403. Recorded in the audit log with the reason.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountChangeRequest' }
      responses:
        '200':
          description: The driver's account after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: REASON_REQUIRED, a disable needs a reason.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/drivers/{driverId}/enable:
    post:
      tags: [admin]
      operationId: enableDriver
      summary: Enable a driver again (ADMIN)
      description: Lets the driver open tracking sessions again. Recorded in the audit log.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountChangeRequest' }
      responses:
        '200':
          description: The driver's account after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/drivers:
    get:
      tags: [admin]
      operationId: listFleetDrivers
      summary: The fleet's drivers, filtered and paged (OPERATOR, ADMIN)
      description: |
        Every driver of the fleet read model (phase 11), newest seen first, drivers never seen last, then by driver
        id. The filters combine. `online` is judged at `at`: heard from within the last 60 seconds. Paged by keyset,
        so a driver who moves between pages is never listed twice on one walk through the pages.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: online, in: query, schema: { type: boolean } }
        - { name: onTrip, in: query, schema: { type: boolean }, description: 'Has a current trip.' }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 }, description: 'Part of the display name in any case, or a whole driver id.' }
        - name: bbox
          in: query
          description: 'minLng,minLat,maxLng,maxLat. Edges count as inside. It may not cross the antimeridian. Drivers with no position are outside.'
          schema: { type: string, examples: ['105.80,21.00,105.90,21.06'] }
        - { name: cursor, in: query, schema: { type: string }, description: 'nextCursor of the previous page.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: One page of drivers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/drivers/{driverId}:
    get:
      tags: [admin]
      operationId: getFleetDriver
      summary: One driver in detail (OPERATOR, ADMIN)
      description: |
        The driver's row of the fleet read model, with their account, their 10 most recent sessions and trips, and
        the health of their latest session that has one computed.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: The driver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/drivers.csv:
    get:
      tags: [admin]
      operationId: exportFleetDriversCsv
      summary: Every driver as CSV (ADMIN)
      description: |
        The whole driver list in list order, streamed, as RFC 4180 CSV with a header row. Decimals use `.`, an
        unknown value is an empty cell, and a text cell that starts with `=`, `+`, `-` or `@` gets a leading `'`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The drivers as a CSV download.
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename=drivers.csv'] }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/overview:
    get:
      tags: [admin]
      operationId: getFleetOverview
      summary: The fleet's headline numbers (OPERATOR, ADMIN)
      description: Counted at most once every 10 seconds on each server instance; `computedAt` says when.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The numbers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/fleet/rebuild:
    post:
      tags: [admin]
      operationId: rebuildFleet
      summary: Rebuild the fleet read model from the source data (ADMIN)
      description: |
        Empties the read model and fills it again from driver accounts, stored fixes, device status and trips, with
        the same rules as the event handlers. Event delivery waits while it runs. Recorded in the audit log as
        FLEET_REBUILT. Positions older than the retention period (90 days) are gone from the source and stay empty.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The read model was rebuilt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetRebuild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/ws-tickets:
    post:
      tags: [admin]
      operationId: issueWsTicket
      summary: A single-use ticket for an admin socket (OPERATOR, ADMIN)
      description: |
        A browser cannot set an Authorization header on a WebSocket. It asks for a ticket here, with its access token,
        and opens `/ws/v1/admin/fleet?ticket=...` (AsyncAPI channel `adminFleet`) or `/ws/v1/admin/trip?ticket=...`
        (channel `adminTrip`, phase 12a) within 30 seconds. The ticket works once, on either socket and on any server
        instance, and the socket runs as the user who asked for it. The access token never appears in a URL. The
        server stores only the ticket's SHA-256.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: listAuditLog
      summary: The audit log (ADMIN)
      description: Every admin action, newest first. Records cannot be changed or deleted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string }, description: 'For example DRIVER_DISABLED, COMMAND_ISSUED.' }
        - { name: targetType, in: query, schema: { type: string }, description: 'DRIVER, TRIP or SESSION.' }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string }, description: 'nextCursor of the previous page.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: One page of records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /health/live:
    get:
      tags: [operations]
      operationId: getLiveness
      summary: Liveness probe
      description: 200 whenever the process can answer. Checks no dependencies, so a database outage never restarts the process.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /health/ready:
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Whether this instance should receive traffic now. Runs every dependency check in parallel with a
        2-second deadline. 503 while a dependency is down or while the instance is shutting down. Checks: `db`
        (Postgres answers) and `graph` (the road map has loaded; DOWN for the first seconds after a start).
      responses:
        '200':
          description: Ready; every check is UP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '503':
          description: Not ready; at least one check is DOWN, or shutdown has begun.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /metrics:
    get:
      tags: [operations]
      operationId: getMetrics
      summary: Prometheus metrics
      description: All metrics in the Prometheus text exposition format (HTTP timers, JVM, connection pool, WebSocket sessions).
      responses:
        '200':
          description: Metrics page.
          content:
            text/plain:
              schema: { type: string }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (JWT). In dev and test, get one from POST /api/v1/dev/tokens. Operations endpoints need none.
  parameters:
    TrackLeg:
      name: leg
      in: query
      description: '`ride`: with the guest in the car. `approach`: from accept to the pickup, for the driver and admins.'
      schema: { type: string, enum: [ride, approach], default: ride }
    TripId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportFrom:
      name: from
      in: query
      required: true
      description: Sessions that started at or after this time.
      schema: { type: string, format: date-time }
    ReportTo:
      name: to
      in: query
      required: true
      description: Sessions that started before this time. At most 31 days after from.
      schema: { type: string, format: date-time }
    SessionId:
      name: id
      in: path
      required: true
      description: The tracking session id the SDK sent in hello.
      schema: { type: string, format: uuid }
    DriverId:
      name: driverId
      in: path
      required: true
      description: The driver's user id.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      description: The ETag of the trip as the caller last saw it. Absent or `*` skips the check.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A new random value (e.g. a UUID) per user action; reuse it only when retrying that action.
      schema: { type: string, minLength: 1, maxLength: 255 }
  headers:
    ETag:
      description: The trip's version, e.g. `"3"`. Send it back in If-Match.
      schema: { type: string }
  responses:
    Trip:
      description: The trip after the request.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Trip' }
    TripSummary:
      description: The trip's summary.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TripSummary' }
    SessionHealth:
      description: The session's health.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionHealth' }
    Unauthorized:
      description: No access token, or an invalid or expired one (UNAUTHORIZED).
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller may not do this (TRIP_ACTION_FORBIDDEN, COMMAND_FORBIDDEN, SESSION_HEALTH_FORBIDDEN, ACCOUNT_ACTION_FORBIDDEN, AUDIT_FORBIDDEN, FLEET_FORBIDDEN, TICKET_FORBIDDEN), e.g. a guest accepting a trip.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: TRIP_NOT_FOUND, no such trip or one the caller may not see. SUMMARY_NOT_READY, the trip has no summary yet. SESSION_HEALTH_NOT_FOUND, no such session or no health computed yet. DRIVER_NOT_FOUND, no such driver account (or, for the fleet, no such driver in the read model either).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: TRACK_EXPIRED, the trip ended longer ago than the retention period (90 days) and its GPS points are deleted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        ILLEGAL_TRANSITION (not possible in the trip's stage, also when another driver accepted it first),
        CONCURRENT_MODIFICATION (changed at the same time; read it again), DRIVER_ALREADY_ON_TRIP, or TRIP_NOT_ENDED
        (the request needs a trip that has ended).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: VERSION_MISMATCH, If-Match names an older version of the trip.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: The body is not readable JSON (MALFORMED_REQUEST) or a field is invalid (VALIDATION_FAILED, with `errors`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RoutingUnavailable:
      description: |
        ROUTING_NOT_READY (the road map is still loading) or ROUTING_TIMEOUT (planning took longer than its budget).
        Retry a little later.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded for this client IP.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Point:
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    RequestTrip:
      type: object
      required: [pickup, destination]
      properties:
        pickup: { $ref: '#/components/schemas/Point' }
        destination: { $ref: '#/components/schemas/Point' }
    TripStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
    Trip:
      type: object
      required: [id, guestId, pickup, destination, status, createdAt, updatedAt, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        driverId:
          type: string
          format: uuid
          description: Absent until a driver accepts the trip.
        pickup: { $ref: '#/components/schemas/Point' }
        destination: { $ref: '#/components/schemas/Point' }
        status: { $ref: '#/components/schemas/TripStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version:
          type: integer
          minimum: 1
          description: Increases by 1 with every change; the same value as the ETag.
        route:
          $ref: '#/components/schemas/TripRoute'
          description: The road route from pickup to destination. Sent by POST /trips and GET /trips/{id} only.
    ProviderReport:
      type: object
      required: [from, to, groups]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ProviderGroup' }
    ProviderGroup:
      type: object
      required: [sessions, lowSample, trackedHours]
      additionalProperties: false
      description: An absent key field means the sessions did not report it; such sessions form their own group.
      properties:
        primaryProvider: { type: string }
        hasGms: { type: boolean }
        rom: { type: string }
        androidSdk: { type: integer }
        sessions: { type: integer, minimum: 1 }
        lowSample: { type: boolean, description: Fewer than 3 sessions, too few to trust the medians. }
        trackedHours: { type: number, description: Total time from each session's start to its last message. }
        acceptedRatio: { type: number }
        intervalP50S: { type: number }
        intervalP95S: { type: number }
        accuracyP50M: { type: number }
        accuracyP95M: { type: number }
        batteryDrainPctPerHour: { type: number }
        gapsPerHour: { type: number, description: Median over sessions of gaps per tracked hour. }
        dozeGapsPerHour: { type: number }
    SessionHealth:
      type: object
      required: [sessionId, startedAt, sessionLastSeenAt, computedAt, fixCount, rejectedCount, rejectionsByReason, gaps, providerMix]
      additionalProperties: false
      properties:
        sessionId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        sessionLastSeenAt:
          type: string
          format: date-time
          description: The session's last message when the health was computed.
        computedAt: { type: string, format: date-time }
        device:
          type: object
          description: The phone, from the device block of hello. Absent when no hello carried one.
          additionalProperties: false
          properties:
            manufacturer: { type: string }
            model: { type: string }
            androidSdk: { type: integer }
            rom: { type: string }
            hasGms: { type: boolean }
        fixCount: { type: integer, minimum: 0, description: Accepted fixes. }
        rejectedCount: { type: integer, minimum: 0 }
        acceptedRatio: { type: number, minimum: 0, maximum: 1, description: Accepted over accepted plus rejected. Absent without fixes. }
        rejectionsByReason:
          type: object
          additionalProperties: { type: integer }
        intervalP50S: { type: number, description: Median time between accepted fixes, by linear interpolation. }
        intervalP95S: { type: number }
        accuracyP50M: { type: number }
        accuracyP95M: { type: number }
        gaps:
          type: array
          description: Intervals longer than 3 times the expected interval and longer than 30 s.
          items:
            type: object
            required: [start, durationS, expectedIntervalS, likelyDoze]
            additionalProperties: false
            properties:
              start: { type: string, format: date-time }
              durationS: { type: number }
              expectedIntervalS: { type: number, description: From the SET_CONSTRAINT in effect at the start, else the default. }
              likelyDoze: { type: boolean, description: 5 minutes or more, and still and not charging on both sides. }
        batteryDrainPctPerHour:
          type: number
          description: Battery percent lost per hour while not charging; positive means the battery runs down.
        providerMix:
          type: object
          description: Each provider's share of the accepted fixes.
          additionalProperties: { type: number }
        primaryProvider: { type: string, description: The provider with the largest share. }
    TripSummary:
      type: object
      required: [tripId, ride, offRouteCount, rerouteCount, rejected, approximate, computedAt]
      additionalProperties: false
      properties:
        tripId: { type: string, format: uuid }
        ride:
          $ref: '#/components/schemas/LegSummary'
          description: From the start of the ride to its end.
        approach:
          $ref: '#/components/schemas/LegSummary'
          description: From accept to arrival at the pickup. Only for the driver and admins.
        plannedDistanceM:
          description: The first planned pickup-to-destination route. Absent when the trip has none.
          type: number
          minimum: 0
        offRouteCount:
          description: How often the driver left the route.
          type: integer
          minimum: 0
        rerouteCount:
          description: How often a new route was planned after that. Lower than offRouteCount when a re-plan failed.
          type: integer
          minimum: 0
        rejected:
          description: Rejected fixes during the ride, by reason (for example POOR_ACCURACY).
          type: object
          additionalProperties: { type: integer, minimum: 1 }
        approximate:
          description: True for a trip stored before stage times existed; the ride then covers the trip's whole life.
          type: boolean
        computedAt: { type: string, format: date-time }
    LegSummary:
      type: object
      required: [distanceM, durationS, movingTimeS, avgSpeedMps, maxSpeedMps, pointCount, startedAt, endedAt]
      additionalProperties: false
      properties:
        distanceM:
          description: Along the recorded points. A gap over 60 s between two points adds nothing.
          type: number
          minimum: 0
        durationS:
          description: The whole leg, stops included.
          type: integer
          minimum: 0
        movingTimeS:
          description: Only the time spent moving at 1 m/s or faster.
          type: integer
          minimum: 0
        avgSpeedMps:
          description: distanceM over movingTimeS; 0 when the driver never moved.
          type: number
          minimum: 0
        maxSpeedMps:
          description: The highest median of three consecutive speeds, so one GPS spike is never the maximum.
          type: number
          minimum: 0
        pointCount: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
    TripRoute:
      type: object
      required: [polyline, distanceM, durationS]
      additionalProperties: false
      properties:
        polyline:
          description: Google Encoded Polyline (precision 5) from pickup to destination.
          type: string
        distanceM: { type: number, minimum: 0 }
        durationS:
          description: At default road speeds, without traffic.
          type: number
          minimum: 0
    PlannedRoute:
      type: object
      required: [polyline, distanceM, durationS, metric]
      additionalProperties: false
      properties:
        polyline:
          description: Google Encoded Polyline (precision 5) from `from` to `to`.
          type: string
        distanceM: { type: number, minimum: 0 }
        durationS:
          description: At default road speeds, without traffic.
          type: number
          minimum: 0
        metric: { type: string, enum: [distance, time] }
    TripPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Trip' }
        nextCursor:
          type: string
          description: Absent on the last page.
    TripHistoryPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TripHistoryItem' }
        nextCursor:
          type: string
          description: Absent on the last page.
    TripHistoryItem:
      type: object
      required: [id, guestId, pickup, destination, status, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        driverId:
          type: string
          format: uuid
          description: Absent until a driver accepts the trip.
        pickup: { $ref: '#/components/schemas/Point' }
        destination: { $ref: '#/components/schemas/Point' }
        status: { $ref: '#/components/schemas/TripStatus' }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        arrivedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt:
          type: string
          format: date-time
          description: When the trip was completed or cancelled.
        rideDistanceM:
          type: number
          minimum: 0
          description: The distance driven during the ride, from the summary. Absent until the summary exists.
    TripTrack:
      type: object
      additionalProperties: false
      required: [tripId, leg, points, timeline]
      properties:
        tripId: { type: string, format: uuid }
        leg: { type: string, enum: [ride, approach] }
        points:
          type: array
          items: { $ref: '#/components/schemas/TrackPoint' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntry' }
        pointsExpired:
          type: boolean
          description: True when the trip ended longer ago than the retention period (90 days). points is then empty for good; the timeline stays.
    TrackFeatureCollection:
      type: object
      required: [type, features]
      description: >-
        RFC 7946. The first feature is the leg (a LineString, or null geometry for fewer than two fixes), with
        `tripId` and `leg` as properties. Each further feature is a timeline entry: a Point, or null geometry, with
        the entry's fields (see TimelineEntry) as properties.
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, properties, geometry]
            properties:
              type: { type: string, enum: [Feature] }
              properties: { type: object }
              geometry:
                type: [object, 'null']
                required: [type, coordinates]
                properties:
                  type: { type: string, enum: [LineString, Point] }
                  coordinates: { type: array }
    TrackPoint:
      type: object
      additionalProperties: false
      required: [lat, lng, at]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        at: { type: string, format: date-time }
        speedMps:
          type: number
          minimum: 0
          description: The phone's speed, or the speed from the previous fix when the phone sent none.
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [at, kind]
      description: >-
        One thing that happened, with the guest socket's names. `status_changed`: the trip reached `status`. The
        `trip_event` names (`driver_arriving`, `driver_low_battery`, `driver_stale`, `driver_back`, `off_route`)
        carry the same fields as there. `route_updated`: a route version was planned. At the same time a stage
        comes first, then a moment, then a route. A later server may add kinds, so a client ignores kinds it does
        not know.
      properties:
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [status_changed, driver_arriving, driver_low_battery, driver_stale, driver_back, off_route, route_updated]
        status:
          $ref: '#/components/schemas/TripStatus'
          description: '`status_changed`: the stage reached. A moment: the stage when it happened.'
        remainingM: { type: number, minimum: 0 }
        levelPercent: { type: integer, minimum: 0, maximum: 100 }
        lastSeenAt: { type: string, format: date-time }
        routeKind: { type: string, enum: [TRIP, APPROACH] }
        routeVersion: { type: integer, minimum: 1 }
        reason:
          type: string
          description: '`route_updated`: `initial` for the first plan of its kind, `off_route` for a re-plan.'
        distanceM: { type: number, minimum: 0 }
        durationS: { type: number, minimum: 0 }
        polyline: { type: string, description: Google Encoded Polyline, precision 5. }
    TrackingAccuracy:
      type: string
      enum: [HIGH, BALANCED, LOW, PASSIVE]
      description: The SDK's accuracy levels, same names as its enum.
    Geofence:
      type: object
      required: [id, lat, lng, radiusM]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        radiusM: { type: number, exclusiveMinimum: 0 }
    IssueCommand:
      type: object
      required: [kind]
      additionalProperties: false
      description: |
        SET_CONSTRAINT needs maxAccuracy, minIntervalMs and reason. REGISTER_GEOFENCES needs regions.
        FLUSH_QUEUE needs nothing else. Every kind accepts a reason, and the server records it in the
        COMMAND_ISSUED audit entry (its `reason` field). Only SET_CONSTRAINT requires one and also sends it to the
        device. The other kinds keep it optional so older clients still work.
      properties:
        kind: { type: string, enum: [SET_CONSTRAINT, REGISTER_GEOFENCES, FLUSH_QUEUE] }
        maxAccuracy: { $ref: '#/components/schemas/TrackingAccuracy' }
        minIntervalMs: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1, description: 'Why the admin sends the command. Kept in the audit log.' }
        regions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Geofence' }
    IssuedCommand:
      type: object
      required: [commandId]
      additionalProperties: false
      properties:
        commandId: { type: string, format: uuid }
    CommandStatus:
      type: string
      enum: [PENDING, SENT, APPLIED, REJECTED, EXPIRED]
    Command:
      type: object
      required: [commandId, driverId, kind, status, createdAt, expiresAt, updatedAt]
      additionalProperties: false
      properties:
        commandId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        kind: { type: string, enum: [SET_CONSTRAINT, REGISTER_GEOFENCES, FLUSH_QUEUE] }
        status: { $ref: '#/components/schemas/CommandStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        maxAccuracy: { $ref: '#/components/schemas/TrackingAccuracy' }
        minIntervalMs: { type: integer, minimum: 0 }
        reason: { type: string }
        regions:
          type: array
          items: { $ref: '#/components/schemas/Geofence' }
    CommandList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Command' }
    Role:
      type: string
      enum: [GUEST, DRIVER, OPERATOR, ADMIN]
      description: OPERATOR (phase 11) reads every trip; ADMIN may also change drivers and devices. Staff tokens last 15 minutes.
    StaffCancelRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, description: 'Required. Kept in the audit log; the guest and the driver never see it.' }
    AccountChangeRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, description: Required to disable. Kept in the audit log. }
    DriverAccount:
      type: object
      required: [driverId, displayName, disabled]
      additionalProperties: false
      properties:
        driverId: { type: string, format: uuid }
        displayName: { type: string }
        disabled: { type: boolean }
        disabledAt: { type: string, format: date-time }
        disabledReason: { type: string }
    FleetPage:
      type: object
      required: [items, at]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FleetDriver' }
        nextCursor: { type: string, description: Absent on the last page. }
        at: { type: string, format: date-time, description: The time online was judged against. }
    FleetDriver:
      type: object
      required: [driverId, enabled, online]
      additionalProperties: false
      properties:
        driverId: { type: string, format: uuid }
        displayName: { type: string, description: Absent until the account is known. }
        enabled: { type: boolean }
        online: { type: boolean, description: Heard from within the last 60 seconds. }
        lastSeenAt: { type: string, format: date-time, description: The newer of the position and device times. }
        position:
          type: object
          required: [lat, lng, at]
          additionalProperties: false
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
            speedMps: { type: number, format: double }
            bearingDeg: { type: number, format: double }
            at: { type: string, format: date-time, description: The fix's recorded time. }
        device:
          type: object
          required: [batteryPct, isCharging, at]
          additionalProperties: false
          properties:
            batteryPct: { type: integer }
            isCharging: { type: boolean }
            motion: { type: string }
            at: { type: string, format: date-time }
        trip:
          type: object
          description: The stage of the driver's newest trip.
          required: [status, at]
          additionalProperties: false
          properties:
            currentTripId: { type: string, format: uuid, description: Absent once the trip has ended. }
            status: { $ref: '#/components/schemas/TripStatus' }
            at: { type: string, format: date-time }
    DriverDetail:
      type: object
      required: [driver, recentSessions, recentTrips, at]
      additionalProperties: false
      properties:
        driver: { $ref: '#/components/schemas/FleetDriver' }
        disabledAt: { type: string, format: date-time }
        disabledReason: { type: string }
        recentSessions:
          type: array
          description: The 10 most recently seen sessions.
          items:
            type: object
            required: [sessionId, startedAt, lastSeenAt]
            additionalProperties: false
            properties:
              sessionId: { type: string, format: uuid }
              startedAt: { type: string, format: date-time }
              lastSeenAt: { type: string, format: date-time }
              manufacturer: { type: string }
              model: { type: string }
              androidSdk: { type: integer }
        recentTrips:
          type: array
          description: The 10 newest trips.
          items:
            type: object
            required: [id, guestId, status, createdAt, updatedAt]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              guestId: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/TripStatus' }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        health:
          type: object
          description: The latest computed session health; absent when none is computed yet.
          required: [sessionId, startedAt, computedAt, fixCount, gapCount]
          additionalProperties: false
          properties:
            sessionId: { type: string, format: uuid }
            startedAt: { type: string, format: date-time }
            computedAt: { type: string, format: date-time }
            fixCount: { type: integer }
            acceptedRatio: { type: number, format: double }
            intervalP50S: { type: number, format: double }
            accuracyP50M: { type: number, format: double }
            gapCount: { type: integer }
            batteryDrainPctPerHour: { type: number, format: double }
            primaryProvider: { type: string }
        at: { type: string, format: date-time }
    FleetOverview:
      type: object
      required: [onlineDrivers, driversOnTrip, activeTrips, disabledDrivers, computedAt]
      additionalProperties: false
      properties:
        onlineDrivers: { type: integer }
        driversOnTrip: { type: integer }
        activeTrips: { type: integer, description: 'Accepted, arrived or in progress.' }
        disabledDrivers: { type: integer }
        computedAt: { type: string, format: date-time }
    FleetRebuild:
      type: object
      required: [drivers]
      additionalProperties: false
      properties:
        drivers: { type: integer, description: Drivers in the rebuilt read model. }
    WsTicket:
      type: object
      required: [ticket, expiresAt]
      additionalProperties: false
      properties:
        ticket:
          description: Put it in the socket URL as `?ticket=`. It works once.
          type: string
        expiresAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditRecord' }
        nextCursor: { type: string, description: Absent on the last page. }
    AuditRecord:
      type: object
      required: [id, at, actorId, actorRole, action, targetType, targetId, details]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actorId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        reason: { type: string }
        details: { type: object, additionalProperties: { type: string } }
        requestId: { type: string, description: The request's id, also in its log lines. }
    DevTokenRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Absent gives a generated name.
        userId:
          type: string
          format: uuid
          description: Log in as this existing user (their name and role are replaced). Absent creates a new user.
    DevTokenResponse:
      type: object
      required: [token, userId, role, displayName, expiresAt]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The access token (a JWT).
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        displayName: { type: string }
        expiresAt: { type: string, format: date-time }
    HealthStatus:
      type: string
      enum: [UP, DOWN]
    HealthReport:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        checks:
          description: One entry per dependency check (readiness only).
          type: object
          additionalProperties: { $ref: '#/components/schemas/HealthStatus' }
    Problem:
      description: RFC 9457 Problem Details plus this API's `code`, `traceId` and `errors` members.
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          description: Identifies the error type; the same for every occurrence.
          type: string
          examples: ['urn:rts:error:trip-not-found']
        title:
          description: Short human summary of the type.
          type: string
        status:
          description: The HTTP status code, repeated.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: What went wrong this time, for humans.
          type: string
        instance:
          description: The request path the problem is about.
          type: string
        code:
          description: Machine-readable error code; clients branch on it. Never renamed once released.
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [TRIP_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED]
        traceId:
          description: Equals the response's X-Request-Id; quote it when reporting a problem.
          type: string
        errors:
          description: One entry per invalid field; only with code VALIDATION_FAILED.
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          description: The JSON field as the client sent it, e.g. `seats` or `stops[2].lat`.
          type: string
        message:
          type: string
