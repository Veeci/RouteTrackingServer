openapi: 3.1.0
info:
  title: RouteTracking Server API
  version: 1.0.0
  description: |
    REST API of the RouteTracking backend.

    - Errors use RFC 9457 Problem Details (`application/problem+json`, schema `Problem`). Clients branch on `code`.
    - Every request gets an `X-Request-Id` response header (the caller's own id is kept when it is safe);
      `Problem.traceId` repeats it so a bug report can be matched to the server logs.
    - Every route is rate limited per client IP; over the limit answers 429 with `Retry-After`.
    - Real-time traffic uses WebSockets, specified separately (AsyncAPI, phase 2).

    This file is the contract: it is written before the code, and API tests fail when a response does not match it.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: operations
    description: Probes and metrics for the hosting platform, not for app users.
  - name: identity
    description: Users and access tokens.
  - name: trips
    description: |
      Booking and running a trip. Every route needs a token. A guest sees only their own trips; a driver sees open
      trips and their own; another user's trip answers 404, the same as a trip that does not exist.
      Stages: REQUESTED → ACCEPTED → ARRIVED → IN_PROGRESS → COMPLETED, or CANCELLED before IN_PROGRESS.
  - name: admin
    description: Operator endpoints; every route needs an ADMIN token. Device commands (phase 5).
paths:
  /api/v1/dev/tokens:
    post:
      tags: [identity]
      operationId: issueDevToken
      summary: Create a user and an access token (dev and test only)
      description: |
        Creates a user with the given role, or reuses `userId`, and returns an access token for that user without
        any password. This route exists only when APP_ENV is dev or test; elsewhere it answers 404.
        Send the token as `Authorization: Bearer <token>` (WebSockets: the same header, or `?token=`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevTokenRequest' }
      responses:
        '200':
          description: The user and their token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips:
    post:
      tags: [trips]
      operationId: requestTrip
      summary: Book a trip (GUEST)
      description: |
        Creates a trip in stage REQUESTED. Send a new random Idempotency-Key per booking: a retry with the same key
        and body returns the first response (header `Idempotent-Replayed: true`) and books nothing new.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestTrip' }
      responses:
        '201':
          description: The trip was created.
          headers:
            Location:
              description: The URL of the new trip.
              schema: { type: string }
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: IDEMPOTENCY_KEY_REUSED, the key was used before for a different request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [trips]
      operationId: listOpenTrips
      summary: List open trips (DRIVER)
      description: Trips that wait for a driver, oldest first, one page at a time (keyset pagination).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: Only REQUESTED is supported.
          schema: { type: string, enum: [REQUESTED], default: REQUESTED }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: One page of trips.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}:
    get:
      tags: [trips]
      operationId: getTrip
      summary: Read a trip
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/accept:
    post:
      tags: [trips]
      operationId: acceptTrip
      summary: Accept an open trip
      description: "DRIVER. The caller becomes the trip's driver. A driver drives one trip at a time (409 DRIVER_ALREADY_ON_TRIP). Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/arrive:
    post:
      tags: [trips]
      operationId: arriveAtPickup
      summary: Mark the driver as arrived at the pickup
      description: "The assigned driver. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/start:
    post:
      tags: [trips]
      operationId: startTrip
      summary: Start the ride
      description: "The assigned driver, after arriving. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/complete:
    post:
      tags: [trips]
      operationId: completeTrip
      summary: Finish the ride
      description: "The assigned driver. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/trips/{id}/cancel:
    post:
      tags: [trips]
      operationId: cancelTrip
      summary: Cancel the trip
      description: "The guest or the assigned driver, before the ride starts. Send If-Match with the last ETag to refuse the change if the trip changed meanwhile (412)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/drivers/{driverId}/commands:
    post:
      tags: [admin]
      operationId: issueCommand
      summary: Send a command to a driver's device (ADMIN)
      description: |
        Stores the command at once and answers 202: the device gets it when it is connected, or right after its next
        `welcome`, and acks it over the driver socket. A command not acked within 10 minutes expires and is never sent.
        A new SET_CONSTRAINT replaces the driver's older ones that were not sent yet.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCommand' }
      responses:
        '202':
          description: The command is stored and waits for the device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [admin]
      operationId: listCommands
      summary: A driver's newest commands and their statuses (ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Up to 50 commands, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /health/live:
    get:
      tags: [operations]
      operationId: getLiveness
      summary: Liveness probe
      description: 200 whenever the process can answer. Checks no dependencies, so a database outage never restarts the process.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /health/ready:
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Whether this instance should receive traffic now. Runs every dependency check in parallel with a
        2-second deadline. 503 while a dependency is down or while the instance is shutting down.
      responses:
        '200':
          description: Ready; every check is UP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '503':
          description: Not ready; at least one check is DOWN, or shutdown has begun.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /metrics:
    get:
      tags: [operations]
      operationId: getMetrics
      summary: Prometheus metrics
      description: All metrics in the Prometheus text exposition format (HTTP timers, JVM, connection pool, WebSocket sessions).
      responses:
        '200':
          description: Metrics page.
          content:
            text/plain:
              schema: { type: string }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (JWT). In dev and test, get one from POST /api/v1/dev/tokens. Operations endpoints need none.
  parameters:
    TripId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DriverId:
      name: driverId
      in: path
      required: true
      description: The driver's user id.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      description: The ETag of the trip as the caller last saw it. Absent or `*` skips the check.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A new random value (e.g. a UUID) per user action; reuse it only when retrying that action.
      schema: { type: string, minLength: 1, maxLength: 255 }
  headers:
    ETag:
      description: The trip's version, e.g. `"3"`. Send it back in If-Match.
      schema: { type: string }
  responses:
    Trip:
      description: The trip after the request.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Trip' }
    Unauthorized:
      description: No access token, or an invalid or expired one (UNAUTHORIZED).
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller may not do this (TRIP_ACTION_FORBIDDEN, COMMAND_FORBIDDEN), e.g. a guest accepting a trip.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: TRIP_NOT_FOUND, no such trip or one the caller may not see.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        ILLEGAL_TRANSITION (not possible in the trip's stage, also when another driver accepted it first),
        CONCURRENT_MODIFICATION (changed at the same time; read it again), or DRIVER_ALREADY_ON_TRIP.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: VERSION_MISMATCH, If-Match names an older version of the trip.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: The body is not readable JSON (MALFORMED_REQUEST) or a field is invalid (VALIDATION_FAILED, with `errors`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded for this client IP.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Point:
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    RequestTrip:
      type: object
      required: [pickup, destination]
      properties:
        pickup: { $ref: '#/components/schemas/Point' }
        destination: { $ref: '#/components/schemas/Point' }
    TripStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
    Trip:
      type: object
      required: [id, guestId, pickup, destination, status, createdAt, updatedAt, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        driverId:
          type: string
          format: uuid
          description: Absent until a driver accepts the trip.
        pickup: { $ref: '#/components/schemas/Point' }
        destination: { $ref: '#/components/schemas/Point' }
        status: { $ref: '#/components/schemas/TripStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version:
          type: integer
          minimum: 1
          description: Increases by 1 with every change; the same value as the ETag.
    TripPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Trip' }
        nextCursor:
          type: string
          description: Absent on the last page.
    TrackingAccuracy:
      type: string
      enum: [HIGH, BALANCED, LOW, PASSIVE]
      description: The SDK's accuracy levels, same names as its enum.
    Geofence:
      type: object
      required: [id, lat, lng, radiusM]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        radiusM: { type: number, exclusiveMinimum: 0 }
    IssueCommand:
      type: object
      required: [kind]
      additionalProperties: false
      description: |
        SET_CONSTRAINT needs maxAccuracy, minIntervalMs and reason. REGISTER_GEOFENCES needs regions.
        FLUSH_QUEUE needs nothing else.
      properties:
        kind: { type: string, enum: [SET_CONSTRAINT, REGISTER_GEOFENCES, FLUSH_QUEUE] }
        maxAccuracy: { $ref: '#/components/schemas/TrackingAccuracy' }
        minIntervalMs: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1 }
        regions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Geofence' }
    IssuedCommand:
      type: object
      required: [commandId]
      additionalProperties: false
      properties:
        commandId: { type: string, format: uuid }
    CommandStatus:
      type: string
      enum: [PENDING, SENT, APPLIED, REJECTED, EXPIRED]
    Command:
      type: object
      required: [commandId, driverId, kind, status, createdAt, expiresAt, updatedAt]
      additionalProperties: false
      properties:
        commandId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        kind: { type: string, enum: [SET_CONSTRAINT, REGISTER_GEOFENCES, FLUSH_QUEUE] }
        status: { $ref: '#/components/schemas/CommandStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        maxAccuracy: { $ref: '#/components/schemas/TrackingAccuracy' }
        minIntervalMs: { type: integer, minimum: 0 }
        reason: { type: string }
        regions:
          type: array
          items: { $ref: '#/components/schemas/Geofence' }
    CommandList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Command' }
    Role:
      type: string
      enum: [GUEST, DRIVER, ADMIN]
    DevTokenRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Absent gives a generated name.
        userId:
          type: string
          format: uuid
          description: Log in as this existing user (their name and role are replaced). Absent creates a new user.
    DevTokenResponse:
      type: object
      required: [token, userId, role, displayName, expiresAt]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The access token (a JWT).
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        displayName: { type: string }
        expiresAt: { type: string, format: date-time }
    HealthStatus:
      type: string
      enum: [UP, DOWN]
    HealthReport:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        checks:
          description: One entry per dependency check (readiness only).
          type: object
          additionalProperties: { $ref: '#/components/schemas/HealthStatus' }
    Problem:
      description: RFC 9457 Problem Details plus this API's `code`, `traceId` and `errors` members.
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          description: Identifies the error type; the same for every occurrence.
          type: string
          examples: ['urn:rts:error:trip-not-found']
        title:
          description: Short human summary of the type.
          type: string
        status:
          description: The HTTP status code, repeated.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: What went wrong this time, for humans.
          type: string
        instance:
          description: The request path the problem is about.
          type: string
        code:
          description: Machine-readable error code; clients branch on it. Never renamed once released.
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [TRIP_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED]
        traceId:
          description: Equals the response's X-Request-Id; quote it when reporting a problem.
          type: string
        errors:
          description: One entry per invalid field; only with code VALIDATION_FAILED.
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          description: The JSON field as the client sent it, e.g. `seats` or `stops[2].lat`.
          type: string
        message:
          type: string
